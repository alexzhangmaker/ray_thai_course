        // Helper to escape HTML characters for safe attribute embedding
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ==========================================
        // IndexedDB 存储逻辑 (共享 ThaiReadingCoachDB)
        // ==========================================
        const DB_NAME = 'ThaiReadingCoachDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'wordQueries';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('sentenceTags')) {
                        const store = db.createObjectStore('sentenceTags', { keyPath: 'id' });
                        store.createIndex('articleId', 'articleId', { unique: false });
                        store.createIndex('article_paragraph_sentence', ['articleId', 'paragraphId', 'sentenceId'], { unique: false });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveQueryRecord(word, explanations) {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const record = {
                        word,
                        explanations,
                        timestamp: Date.now()
                    };
                    const request = store.add(record);
                    request.onsuccess = () => resolve(true);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to save to IndexedDB:', err);
            }
        }

        async function getQueryHistory() {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = (e) => {
                        const records = e.target.result || [];
                        records.sort((a, b) => b.timestamp - a.timestamp);
                        resolve(records);
                    };
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to read from IndexedDB:', err);
                return [];
            }
        }

        async function deleteQueryRecord(id) {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve(true);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to delete from IndexedDB:', err);
            }
        }

        // ==========================================
        // Worker AI Token 管理
        // ==========================================
        const TOKEN_STORAGE_KEY = 'workerai_auth_token';

        function getWorkerAuthHeaders(extraHeaders = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...extraHeaders
            };
            const inputEl = document.getElementById('workerAuthToken');
            const token = (inputEl ? inputEl.value : (localStorage.getItem(TOKEN_STORAGE_KEY) || '')).trim();
            if (token && token.length > 0) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            return headers;
        }

        function initWorkerAuthTokenSync() {
            const inputEl = document.getElementById('workerAuthToken');
            if (!inputEl) return;
            inputEl.value = localStorage.getItem(TOKEN_STORAGE_KEY) || '';
            inputEl.addEventListener('input', () => {
                localStorage.setItem(TOKEN_STORAGE_KEY, inputEl.value.trim());
            });
        }

        // ==========================================
        // 单词查词与浮动选择工具栏逻辑
        // ==========================================
        let selectedWordText = '';
        const selectionToolbar = document.getElementById('selectionToolbar');
        const queryBtn = document.getElementById('queryBtn');
        const sidebar = document.getElementById('querySidebar');
        const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
        const sidebarToggleIcon = document.getElementById('sidebarToggleIcon');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const sidebarListContainer = document.getElementById('sidebarListContainer');
        const sidebarEmptyState = document.getElementById('sidebarEmptyState');
        const manualQueryInput = document.getElementById('manualQueryInput');
        const manualQueryBtn = document.getElementById('manualQueryBtn');

        function toggleSidebar(open) {
            const isOpen = open !== undefined ? open : !sidebar.classList.contains('sidebar-open');
            if (isOpen) {
                sidebar.classList.add('sidebar-open');
                sidebarToggleBtn.classList.add('sidebar-open');
                if (sidebarToggleIcon) {
                    sidebarToggleIcon.className = "fas fa-chevron-right";
                }
                updateSidebarView();
            } else {
                sidebar.classList.remove('sidebar-open');
                sidebarToggleBtn.classList.remove('sidebar-open');
                if (sidebarToggleIcon) {
                    sidebarToggleIcon.className = "fas fa-chevron-left";
                }
            }
            // 延迟触发布局重算，让右侧预览 A4 纸张按比例缩放适配
            setTimeout(adjustPreviewScale, 310);
        }

        if (sidebarToggleBtn) {
            sidebarToggleBtn.addEventListener('click', () => toggleSidebar());
        }
        if (closeSidebarBtn) {
            closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
        }

        // 浮动选择工具栏事件监听
        document.addEventListener('selectionchange', () => {
            const selection = window.getSelection();
            if (!selection || selection.isCollapsed) {
                if (selectionToolbar) selectionToolbar.classList.add('hidden');
                return;
            }

            const text = selection.toString().trim();
            if (!text) {
                if (selectionToolbar) selectionToolbar.classList.add('hidden');
                return;
            }

            const range = selection.getRangeAt(0);
            const ancestorNode = range.commonAncestorContainer;
            const ancestorEl = ancestorNode.nodeType === Node.ELEMENT_NODE ? ancestorNode : ancestorNode.parentElement;
            
            // 忽略在侧边栏内部或工具栏内部的选择
            const inSidebar = sidebar && sidebar.contains(ancestorEl);
            const inToolbar = selectionToolbar && selectionToolbar.contains(ancestorEl);
            const hasThai = /[\u0e00-\u0e7f]/.test(text);

            if (!inSidebar && !inToolbar && hasThai) {
                selectedWordText = text;
                if (selectionToolbar) {
                    selectionToolbar.classList.remove('hidden');
                    
                    const rect = range.getBoundingClientRect();
                    const toolbarWidth = 100;
                    const toolbarHeight = 34;
                    
                    const left = rect.left + rect.width / 2 - toolbarWidth / 2;
                    let top = rect.top - toolbarHeight - 8;
                    if (top < 10) {
                        top = rect.bottom + 8;
                    }
                    
                    selectionToolbar.style.left = `${Math.max(10, Math.min(left, window.innerWidth - toolbarWidth - 10))}px`;
                    selectionToolbar.style.top = `${Math.max(10, Math.min(top, window.innerHeight - toolbarHeight - 10))}px`;
                }
            } else {
                if (selectionToolbar) selectionToolbar.classList.add('hidden');
            }
        });

        // 阻止工具栏 mousedown 事件导致选区丢失
        if (selectionToolbar) {
            selectionToolbar.addEventListener('mousedown', (e) => {
                e.preventDefault();
            });
        }

        if (queryBtn) {
            queryBtn.addEventListener('click', async () => {
                const word = selectedWordText.trim();
                if (!word) return;

                if (selectionToolbar) selectionToolbar.classList.add('hidden');
                const selection = window.getSelection();
                if (selection) selection.removeAllRanges();

                await queryWord(word);
            });
        }

        async function triggerManualQuery() {
            if (!manualQueryInput) return;
            const word = manualQueryInput.value.trim();
            if (!word) return;
            manualQueryInput.value = '';
            await queryWord(word);
        }

        if (manualQueryBtn) {
            manualQueryBtn.addEventListener('click', triggerManualQuery);
        }
        if (manualQueryInput) {
            manualQueryInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    triggerManualQuery();
                }
            });
        }

        // 绑定侧边栏查词记录内的发音点击与删除按钮
        if (sidebarListContainer) {
            sidebarListContainer.addEventListener('click', async (e) => {
                const deleteBtn = e.target.closest('.delete-sidebar-item-btn');
                if (deleteBtn) {
                    const id = parseInt(deleteBtn.dataset.id, 10);
                    if (!isNaN(id)) {
                        await deleteQueryRecord(id);
                        await updateSidebarView();
                    }
                    return;
                }

                const clickable = e.target.closest('.font-thai-clickable');
                if (clickable) {
                    const word = clickable.dataset.word;
                    if (word) window.playAudioDirect(word);
                }
            });
        }

        async function updateSidebarView() {
            const history = await getQueryHistory();
            if (history && history.length > 0) {
                if (sidebarEmptyState) sidebarEmptyState.classList.add('hidden');
                if (sidebarListContainer) {
                    sidebarListContainer.classList.remove('hidden');
                    sidebarListContainer.innerHTML = history.map(item => {
                        const timeStr = new Date(item.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                        let expHtml = '';
                        if (item.explanations && Array.isArray(item.explanations) && item.explanations.length > 0) {
                            expHtml = item.explanations.map(exp => `
                                <div class="query-exp-item">
                                    <span class="query-exp-badge">译</span>
                                    <span class="query-exp-zh">${escapeHtml(exp.meanCh || '')}</span>
                                    ${exp.meanEn ? `<span class="query-exp-en">(${escapeHtml(exp.meanEn)})</span>` : ''}
                                </div>
                            `).join('');
                        } else {
                            expHtml = `<p style="font-size: 11px; color: #94a3b8; font-style: italic; margin: 0; padding-top: 4px;">未找到该单词的详细解释</p>`;
                        }
                        return `
                            <div class="query-card">
                                <div class="query-card-header">
                                    <h4 class="query-card-word font-thai-clickable" data-word="${escapeHtml(item.word)}" title="点击播放发音">
                                        ${escapeHtml(item.word)}
                                        <i class="fas fa-volume-up"></i>
                                    </h4>
                                    <div class="query-card-actions">
                                        <span class="query-card-time">${timeStr}</span>
                                        <button class="delete-sidebar-item-btn query-card-del-btn" data-id="${item.id}" title="删除记录">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="query-card-exps">
                                    ${expHtml}
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } else {
                if (sidebarEmptyState) sidebarEmptyState.classList.remove('hidden');
                if (sidebarListContainer) {
                    sidebarListContainer.classList.add('hidden');
                    sidebarListContainer.innerHTML = '';
                }
            }
        }

        async function queryWord(word) {
            if (!word) return;

            // 展开侧边栏
            toggleSidebar(true);

            if (sidebarEmptyState) sidebarEmptyState.classList.add('hidden');
            if (sidebarListContainer) sidebarListContainer.classList.remove('hidden');

            // 插入加载骨架
            const loaderId = 'query-loader-' + Date.now();
            const loaderHtml = `
                <div id="${loaderId}" class="query-card-loader pulse-animated">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 15px; font-weight: 700; color: #1e293b; font-family: var(--font-thai);">${escapeHtml(word)}</span>
                        <span style="font-size: 11px; color: #94a3b8;">正在查询...</span>
                    </div>
                    <div class="loader-line" style="width: 75%; margin-top: 4px;"></div>
                    <div class="loader-line" style="width: 50%;"></div>
                </div>
            `;
            if (sidebarListContainer) {
                sidebarListContainer.insertAdjacentHTML('afterbegin', loaderHtml);
                sidebarListContainer.scrollTop = 0;
            }

            try {
                const response = await fetch("https://thai-semantic-match-worker.alexszhang.workers.dev/explain", {
                    method: "POST",
                    headers: getWorkerAuthHeaders(),
                    body: JSON.stringify({ word: word })
                });

                if (response.status === 401) {
                    throw new Error("401 未授权访问：请检查 API Auth Token 是否正确！");
                }

                if (!response.ok) {
                    throw new Error(`请求失败 (${response.status})`);
                }

                const resText = await response.text();
                const result = resText ? JSON.parse(resText) : {};

                // 保存至 IndexedDB
                await saveQueryRecord(word, result);

                // 刷新侧边栏
                await updateSidebarView();
            } catch (error) {
                console.error('API Query Error:', error);
                const loader = document.getElementById(loaderId);
                if (loader) {
                    loader.classList.remove('pulse-animated');
                    loader.className = "query-card-error";
                    loader.innerHTML = `
                        <div class="query-error-header">
                            <span class="query-error-word">${escapeHtml(word)}</span>
                            <span class="query-error-badge">查询失败</span>
                        </div>
                        <div class="query-error-msg">
                            ${escapeHtml(error.message || '网络连接失败')}
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
