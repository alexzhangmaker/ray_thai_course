<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ThaiNotes 伴侣屏 · 泰语听写第二屏幕</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Serif+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Noto Sans SC', 'sans-serif'],
                        thai: ['Noto Serif Thai', 'Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #17112c 0%, #0c0a17 60%, #07060d 100%);
            --glass-bg: rgba(26, 22, 48, 0.65);
            --glass-card: rgba(30, 26, 58, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: #f8fafc;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        .font-thai {
            font-family: 'Noto Serif Thai', 'Sarabun', serif;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
        }

        /* Sound Wave Animation */
        .sound-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 28px;
        }
        .sound-bar {
            width: 4px;
            height: 8px;
            background: #a78bfa;
            border-radius: 9999px;
            animation: soundWave 1s ease-in-out infinite;
        }
        .sound-bar:nth-child(2) { animation-delay: 0.15s; height: 16px; }
        .sound-bar:nth-child(3) { animation-delay: 0.3s; height: 24px; }
        .sound-bar:nth-child(4) { animation-delay: 0.45s; height: 14px; }
        .sound-bar:nth-child(5) { animation-delay: 0.2s; height: 10px; }

        @keyframes soundWave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
            50% { transform: scaleY(1.2); opacity: 1; }
        }

        /* Pulse ring for active audio */
        .pulse-ring-active {
            animation: pulseRing 1.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col justify-between selection:bg-violet-500 selection:text-white">

    <!-- Top Connection / Status Bar -->
    <header class="w-full max-w-lg mx-auto px-4 py-3 flex items-center justify-between border-b border-white/10 shrink-0">
        <div class="flex items-center gap-2.5">
            <div class="h-8 w-8 rounded-xl bg-gradient-to-tr from-violet-600 to-fuchsia-600 flex items-center justify-center text-white text-base shadow-md">
                <i class="ph-bold ph-device-mobile"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold text-white leading-tight flex items-center gap-1.5">
                    ThaiNotes 伴侣屏
                    <span class="text-[9px] uppercase font-bold px-1.5 py-0.2 rounded bg-violet-500/20 text-violet-300 border border-violet-500/30">SideApp</span>
                </h1>
                <p class="text-[10px] text-slate-400">第二屏幕 · 被动呈现</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Connection Indicator Pill -->
            <div class="h-7 px-2.5 rounded-full bg-white/5 border border-white/10 flex items-center gap-1.5 text-xs text-slate-300">
                <span id="sideAppHeaderDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span id="sideAppHeaderText" class="text-[11px] font-medium">连接中...</span>
            </div>

            <!-- Manual Pairing Code button -->
            <button onclick="window.sideAppWsClient.showPairingInputScreen()" title="重新配对" class="h-7 w-7 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition">
                <i class="ph-bold ph-key text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Floating Reconnect / Status Banner -->
    <div id="sideAppStatusBanner" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-violet-600/90 text-white text-xs font-semibold shadow-lg backdrop-blur-md hidden items-center gap-2 border border-violet-400/30">
        <i class="ph-bold ph-arrows-clockwise animate-spin text-sm"></i>
        <span id="sideAppStatusBannerText">正在连接主屏...</span>
    </div>

    <!-- Main Dynamic Content Container -->
    <main class="flex-1 w-full max-w-lg mx-auto p-4 flex flex-col justify-center" id="sideAppRoot">
        <!-- Initial skeleton placeholder before websocket messages arrive -->
        <div class="glass-panel rounded-3xl p-6 text-center space-y-4">
            <div class="inline-flex h-14 w-14 rounded-2xl bg-white/5 items-center justify-center text-2xl text-violet-400 animate-pulse">
                <i class="ph-bold ph-wifi-high"></i>
            </div>
            <div class="space-y-1">
                <h3 class="text-base font-bold text-white">正在同步操作台界面...</h3>
                <p class="text-xs text-slate-400">请确保 iMac 操作台已打开并启用了伴侣屏特性</p>
            </div>
        </div>
    </main>

    <!-- Bottom Footer Tip -->
    <footer class="w-full max-w-lg mx-auto px-4 py-2.5 text-center text-[10px] text-slate-500 shrink-0">
        ThaiNotes SideApp v1.0 · 单向无状态渲染器
    </footer>

    <!-- Manual Pairing Code Modal -->
    <div id="sideAppPairingCodeModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 border border-white/15 shadow-2xl space-y-5 text-center">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-violet-600 to-fuchsia-600 mx-auto flex items-center justify-center text-2xl text-white shadow-lg">
                <i class="ph-bold ph-key"></i>
            </div>
            <div class="space-y-1">
                <h3 class="text-lg font-bold text-white">输入配对码连接</h3>
                <p class="text-xs text-slate-400">在 iMac 操作台顶部点击"伴侣屏"即可看到 4 位配对码</p>
            </div>

            <!-- Error Notice -->
            <div id="sideAppPairError" class="p-2.5 rounded-xl bg-red-500/20 border border-red-500/30 text-xs text-red-200 hidden">
                配对码无效或已过期
            </div>

            <div class="space-y-3">
                <input id="inputPairingCode" type="text" maxlength="6" placeholder="输入 4 位配对码 (如 A3F9)" class="w-full py-3 px-4 rounded-xl bg-white/10 border border-white/15 text-center font-mono text-xl tracking-widest text-white uppercase placeholder:text-slate-500 placeholder:text-sm focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30">
                <button onclick="submitManualPairingCode()" class="w-full py-3 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold text-sm shadow-lg shadow-violet-500/25 active:scale-98 transition">
                    立即连接伴侣屏
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/Pages/sideapp/renderer.js"></script>
    <script src="/Pages/sideapp/wsClient.js"></script>
    <script>
        function submitManualPairingCode() {
            const input = document.getElementById('inputPairingCode');
            const code = input ? input.value.trim().toUpperCase() : '';
            if (!code) return;
            window.sideAppWsClient.pairingCode = code;
            window.sideAppWsClient.pairWithCode(code);
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.sideAppRenderer.init();
            window.sideAppWsClient.init();
        });
    </script>
</body>
</html>
