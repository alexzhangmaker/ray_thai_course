<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ThaiNotes 伴侣屏 · 泰语听写第二屏幕</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Serif+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Noto Sans SC', 'sans-serif'],
                        thai: ['Noto Serif Thai', 'Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #17112c 0%, #0c0a17 60%, #07060d 100%);
            --glass-bg: rgba(26, 22, 48, 0.65);
            --glass-card: rgba(30, 26, 58, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background: var(--bg-gradient);
            color: #f8fafc;
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Fullscreen & pseudo-fullscreen styling */
        html, html:fullscreen, html:-webkit-full-screen, body:fullscreen, body:-webkit-full-screen {
            background: var(--bg-gradient);
            height: 100vh;
            height: 100dvh;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
        }

        ::backdrop {
            background: #07060d;
        }

        body.sideapp-pseudo-fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 40;
            overflow: hidden;
        }

        /* Courseware PDF Viewport Specific Fullscreen Styling */
        #sidePdfViewport:fullscreen,
        #sidePdfViewport:-webkit-full-screen,
        #sidePdfViewport.side-pdf-content-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            max-width: none !important;
            max-height: none !important;
            z-index: 100 !important;
            border-radius: 0 !important;
            margin: 0 !important;
            padding: 0.5rem !important;
            background: #07060d !important;
            border: none !important;
            box-shadow: none !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: auto !important;
        }

        #sidePdfViewport:fullscreen #sidePdfFullscreenBar,
        #sidePdfViewport:-webkit-full-screen #sidePdfFullscreenBar,
        #sidePdfViewport.side-pdf-content-fullscreen #sidePdfFullscreenBar {
            display: flex !important;
        }

        #sidePdfViewport:fullscreen #sidePdfQuickMaxBtn,
        #sidePdfViewport:-webkit-full-screen #sidePdfQuickMaxBtn,
        #sidePdfViewport.side-pdf-content-fullscreen #sidePdfQuickMaxBtn {
            display: none !important;
        }

        /* Responsive adaptation for compact / landscape mobile screens */
        @media (max-height: 520px) {
            header {
                padding-top: 0.35rem !important;
                padding-bottom: 0.35rem !important;
            }
            header .sideapp-header-icon {
                height: 1.6rem !important;
                width: 1.6rem !important;
                font-size: 0.75rem !important;
            }
            header h1 {
                font-size: 0.75rem !important;
            }
            #sideAppSubheader {
                display: none !important;
            }
            footer {
                padding-top: 0.2rem !important;
                padding-bottom: 0.2rem !important;
                font-size: 8px !important;
            }
            main#sideAppRoot {
                padding: 0.25rem 0.5rem !important;
            }
        }

        .font-thai {
            font-family: 'Noto Serif Thai', 'Sarabun', serif;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .glass-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
        }

        /* Sound Wave Animation */
        .sound-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 28px;
        }
        .sound-bar {
            width: 4px;
            height: 8px;
            background: #a78bfa;
            border-radius: 9999px;
            animation: soundWave 1s ease-in-out infinite;
        }
        .sound-bar:nth-child(2) { animation-delay: 0.15s; height: 16px; }
        .sound-bar:nth-child(3) { animation-delay: 0.3s; height: 24px; }
        .sound-bar:nth-child(4) { animation-delay: 0.45s; height: 14px; }
        .sound-bar:nth-child(5) { animation-delay: 0.2s; height: 10px; }

        @keyframes soundWave {
            0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
            50% { transform: scaleY(1.2); opacity: 1; }
        }

        /* Pulse ring for active audio */
        .pulse-ring-active {
            animation: pulseRing 1.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-screen h-[100dvh] flex flex-col justify-between overflow-hidden selection:bg-violet-500 selection:text-white">

    <!-- Top Connection / Status Bar -->
    <header class="w-full px-3 sm:px-6 py-2 sm:py-2.5 flex items-center justify-between border-b border-white/10 shrink-0 select-none">
        <div class="flex items-center gap-2 sm:gap-2.5">
            <div class="sideapp-header-icon h-8 w-8 rounded-xl bg-gradient-to-tr from-violet-600 to-fuchsia-600 flex items-center justify-center text-white text-base shadow-md shrink-0">
                <i class="ph-bold ph-device-mobile"></i>
            </div>
            <div>
                <h1 class="text-xs sm:text-sm font-bold text-white leading-tight flex items-center gap-1.5">
                    ThaiNotes 伴侣屏
                    <span id="sideAppBadge" class="text-[9px] uppercase font-bold px-1.5 py-0.2 rounded bg-violet-500/20 text-violet-300 border border-violet-500/30">SideApp</span>
                </h1>
                <p id="sideAppSubheader" class="text-[10px] text-slate-400">第二屏幕 · 被动呈现</p>
            </div>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2">
            <!-- Connection Indicator Pill -->
            <div class="h-7 px-2 sm:px-2.5 rounded-full bg-white/5 border border-white/10 flex items-center gap-1.5 text-xs text-slate-300">
                <span id="sideAppHeaderDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                <span id="sideAppHeaderText" class="text-[10px] sm:text-[11px] font-medium">连接中...</span>
            </div>

            <!-- Fullscreen Toggle button -->
            <button id="sideAppFullscreenBtn" onclick="toggleSideAppFullscreen()" title="全屏显示 (快捷键 F)" aria-label="全屏显示" class="h-7 w-7 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition">
                <i id="sideAppFullscreenIcon" class="ph-bold ph-arrows-out text-xs"></i>
            </button>

            <!-- Manual Pairing Code button -->
            <button onclick="window.sideAppWsClient.showPairingInputScreen()" title="重新配对" class="h-7 w-7 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition">
                <i class="ph-bold ph-key text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Floating Reconnect / Status Banner -->
    <div id="sideAppStatusBanner" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-violet-600/90 text-white text-xs font-semibold shadow-lg backdrop-blur-md hidden items-center gap-2 border border-violet-400/30">
        <i class="ph-bold ph-arrows-clockwise animate-spin text-sm"></i>
        <span id="sideAppStatusBannerText">正在连接主屏...</span>
    </div>

    <!-- Floating Toast Notification -->
    <div id="sideAppToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-slate-900/90 text-white text-xs font-medium shadow-xl backdrop-blur-md pointer-events-none transition-all duration-300 opacity-0 translate-y-2 border border-white/10 flex items-center gap-2">
        <i id="sideAppToastIcon" class="ph-bold ph-arrows-out text-violet-400"></i>
        <span id="sideAppToastText"></span>
    </div>

    <!-- Main Dynamic Content Container -->
    <main class="flex-1 w-full min-h-0 px-2.5 py-2 sm:px-4 sm:py-3 md:px-6 md:py-4 flex flex-col justify-center items-center overflow-hidden" id="sideAppRoot">
        <!-- Initial skeleton placeholder before websocket messages arrive -->
        <div class="w-full h-full max-w-4xl glass-panel rounded-3xl p-6 sm:p-10 flex flex-col items-center justify-center text-center space-y-4">
            <div class="inline-flex h-16 w-16 sm:h-20 sm:w-20 rounded-2xl bg-white/5 items-center justify-center text-3xl sm:text-4xl text-violet-400 animate-pulse">
                <i class="ph-bold ph-wifi-high"></i>
            </div>
            <div class="space-y-1.5">
                <h3 class="text-base sm:text-xl font-bold text-white">正在同步操作台界面...</h3>
                <p class="text-xs sm:text-sm text-slate-400 max-w-md mx-auto">请确保 iMac 操作台已打开并启用了伴侣屏特性。屏幕将自适应最大化显示。</p>
            </div>
        </div>
    </main>

    <!-- Bottom Footer Tip -->
    <footer class="w-full px-3 sm:px-6 py-1.5 text-center text-[10px] text-slate-500 shrink-0 flex items-center justify-center gap-2">
        <span>ThaiNotes SideApp v1.0 · 单向无状态渲染器</span>
        <span>·</span>
        <button onclick="toggleSideAppFullscreen()" class="hover:text-slate-300 transition underline underline-offset-2">切换全屏</button>
    </footer>

    <!-- Manual Pairing Code Modal -->
    <div id="sideAppPairingCodeModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 border border-white/15 shadow-2xl space-y-5 text-center">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-violet-600 to-fuchsia-600 mx-auto flex items-center justify-center text-2xl text-white shadow-lg">
                <i class="ph-bold ph-key"></i>
            </div>
            <div class="space-y-1">
                <h3 class="text-lg font-bold text-white">输入配对码连接</h3>
                <p class="text-xs text-slate-400">在 iMac 操作台顶部点击"伴侣屏"即可看到 4 位配对码</p>
            </div>

            <!-- Error Notice -->
            <div id="sideAppPairError" class="p-2.5 rounded-xl bg-red-500/20 border border-red-500/30 text-xs text-red-200 hidden">
                配对码无效或已过期
            </div>

            <div class="space-y-3">
                <input id="inputPairingCode" type="text" maxlength="6" placeholder="输入 4 位配对码 (如 A3F9)" class="w-full py-3 px-4 rounded-xl bg-white/10 border border-white/15 text-center font-mono text-xl tracking-widest text-white uppercase placeholder:text-slate-500 placeholder:text-sm focus:outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500/30">
                <button onclick="submitManualPairingCode()" class="w-full py-3 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white font-bold text-sm shadow-lg shadow-violet-500/25 active:scale-98 transition">
                    立即连接伴侣屏
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="/Pages/sideapp/renderer.js"></script>
    <script src="/Pages/sideapp/wsClient.js"></script>
    <script>
        function submitManualPairingCode() {
            const input = document.getElementById('inputPairingCode');
            const code = input ? input.value.trim().toUpperCase() : '';
            if (!code) return;
            window.sideAppWsClient.pairingCode = code;
            window.sideAppWsClient.pairWithCode(code);
        }

        // =========================================================================
        // Fullscreen Toggle & Viewport Handling
        // =========================================================================
        let toastTimeout = null;
        function showFullscreenToast(message, iconClass = 'ph-arrows-out') {
            const toast = document.getElementById('sideAppToast');
            const toastText = document.getElementById('sideAppToastText');
            const toastIcon = document.getElementById('sideAppToastIcon');
            if (!toast || !toastText) return;

            toastText.textContent = message;
            if (toastIcon) {
                toastIcon.className = `ph-bold ${iconClass} text-violet-400`;
            }

            toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
            }, 2200);
        }

        function isSideAppFullscreen() {
            return !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement ||
                document.body.classList.contains('sideapp-pseudo-fullscreen')
            );
        }

        function updateFullscreenUI(forceState) {
            const isFs = typeof forceState === 'boolean' ? forceState : isSideAppFullscreen();
            const btn = document.getElementById('sideAppFullscreenBtn');
            const icon = document.getElementById('sideAppFullscreenIcon');
            if (!btn || !icon) return;

            if (isFs) {
                btn.title = '退出全屏 (快捷键 F)';
                btn.setAttribute('aria-label', '退出全屏');
                icon.className = 'ph-bold ph-arrows-in text-xs';
                btn.classList.add('bg-violet-600/30', 'text-violet-300', 'border-violet-500/40');
                btn.classList.remove('bg-white/5', 'text-slate-400');
            } else {
                btn.title = '全屏显示 (快捷键 F)';
                btn.setAttribute('aria-label', '全屏显示');
                icon.className = 'ph-bold ph-arrows-out text-xs';
                btn.classList.remove('bg-violet-600/30', 'text-violet-300', 'border-violet-500/40');
                btn.classList.add('bg-white/5', 'text-slate-400');
            }
        }

        async function toggleSideAppFullscreen() {
            const isNativeFs = !!(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement
            );
            const isPseudoFs = document.body.classList.contains('sideapp-pseudo-fullscreen');

            if (isNativeFs || isPseudoFs) {
                // Exit Fullscreen
                if (isNativeFs) {
                    try {
                        if (document.exitFullscreen) {
                            await document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) {
                            await document.webkitExitFullscreen();
                        } else if (document.mozCancelFullScreen) {
                            await document.mozCancelFullScreen();
                        } else if (document.msExitFullscreen) {
                            await document.msExitFullscreen();
                        }
                    } catch (err) {
                        console.warn('[SideApp] Exit fullscreen error:', err);
                    }
                }
                if (isPseudoFs) {
                    document.body.classList.remove('sideapp-pseudo-fullscreen');
                }
                updateFullscreenUI(false);
                showFullscreenToast('已退出全屏模式', 'ph-arrows-out');
            } else {
                // Enter Fullscreen
                const docEl = document.documentElement;
                let entered = false;
                try {
                    if (docEl.requestFullscreen) {
                        await docEl.requestFullscreen();
                        entered = true;
                    } else if (docEl.webkitRequestFullscreen) {
                        await docEl.webkitRequestFullscreen();
                        entered = true;
                    } else if (docEl.mozRequestFullScreen) {
                        await docEl.mozRequestFullScreen();
                        entered = true;
                    } else if (docEl.msRequestFullscreen) {
                        await docEl.msRequestFullscreen();
                        entered = true;
                    }
                } catch (err) {
                    console.warn('[SideApp] requestFullscreen failed, using pseudo-fullscreen fallback:', err);
                }

                if (entered) {
                    updateFullscreenUI(true);
                    showFullscreenToast('已进入全屏显示', 'ph-arrows-in');
                } else {
                    // Fallback for iOS Safari or restricted browser contexts
                    document.body.classList.add('sideapp-pseudo-fullscreen');
                    window.scrollTo(0, 1);
                    updateFullscreenUI(true);
                    showFullscreenToast('已开启沉浸模式（iOS可添加至主屏幕实现原生全屏）', 'ph-arrows-in');
                }
            }
        }

        window.toggleSideAppFullscreen = toggleSideAppFullscreen;

        document.addEventListener('DOMContentLoaded', () => {
            window.sideAppRenderer.init();
            window.sideAppWsClient.init();

            // Listen for native browser fullscreen changes
            ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
                document.addEventListener(evt, () => updateFullscreenUI());
            });

            // Keyboard shortcut: F to toggle fullscreen, Esc to exit pseudo fullscreen
            document.addEventListener('keydown', (e) => {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
                    return;
                }
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    toggleSideAppFullscreen();
                } else if (e.key === 'Escape' && document.body.classList.contains('sideapp-pseudo-fullscreen')) {
                    document.body.classList.remove('sideapp-pseudo-fullscreen');
                    updateFullscreenUI(false);
                    showFullscreenToast('已退出全屏模式', 'ph-arrows-out');
                }
            });

            // Double click header background to toggle fullscreen
            const header = document.querySelector('header');
            if (header) {
                header.addEventListener('dblclick', (e) => {
                    if (e.target.closest('button, input, a')) return;
                    toggleSideAppFullscreen();
                });
            }
        });
    </script>
</body>
</html>
