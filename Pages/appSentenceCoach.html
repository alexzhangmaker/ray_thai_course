                    >
                        <div>
                            <!-- Top Header Row -->
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-[10px] px-2 py-0.5 rounded-md bg-blue-50 text-[#2563EB] font-black border border-blue-100 uppercase tracking-wider">
                                        ${p.level || 'A1'}
                                    </span>
                                    ${p.topic ? `
                                        <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-medium truncate max-w-[120px]">
                                            ${p.topic}
                                        </span>
                                    ` : ''}
                                </div>
                                ${statusBadge}
                            </div>

                            <!-- Index & Pattern Name -->
                            <div class="text-[11px] text-slate-400 font-semibold mb-1">
                                句型 ${idx + 1}
                            </div>
                            <h3 class="text-base font-bold text-[#1E293B] group-hover:text-[#2563EB] transition leading-snug line-clamp-2 min-h-[44px]">
                                ${p.patternName}
                            </h3>

                            <!-- Formula Preview Box -->
                            <div class="bg-slate-900 text-slate-100 rounded-xl p-3 text-center text-xs font-thai font-medium tracking-wide my-3 truncate shadow-inner select-none border border-slate-950">
                                ${p.formula && p.formula.display ? p.formula.display : p.patternName}
                            </div>

                            <!-- Usage summary -->
                            <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed min-h-[36px]">
                                ${p.usage ? (p.usage.summary || p.usage.detail || '') : '掌握该句型的核心语法构造与应用场景。'}
                            </p>

                            <!-- Self Ratings Display Box (例句自评 & 练习自评) -->
                            <div class="grid grid-cols-2 gap-2 my-3 p-2.5 bg-slate-50/90 rounded-xl border border-slate-200/70 font-sans">
                                <div class="flex flex-col gap-0.5">
                                    <span class="text-[10px] text-slate-400 font-medium flex items-center gap-1">
                                        <i class="ph ph-chat-circle-dots text-amber-500"></i> 例句自评
                                    </span>
                                    <div class="text-xs font-bold flex items-center gap-1 ${statusInfo.exampleScore !== null ? 'text-amber-700' : 'text-slate-400 font-normal'}">
                                        ${statusInfo.exampleScore !== null ? `<i class="ph-fill ph-star text-amber-500 text-xs"></i><span>${statusInfo.exampleScore} / 5 分</span>` : '<span class="text-[11px]">未评分</span>'}
                                    </div>
                                </div>
                                <div class="flex flex-col gap-0.5 border-l border-slate-200 pl-2.5">
                                    <span class="text-[10px] text-slate-400 font-medium flex items-center gap-1">
                                        <i class="ph ph-pencil-line text-blue-500"></i> 练习自评
                                    </span>
                                    <div class="text-xs font-bold flex items-center gap-1 ${statusInfo.practiceScore !== null ? 'text-blue-700' : 'text-slate-400 font-normal'}">
                                        ${statusInfo.practiceScore !== null ? `<i class="ph-fill ph-star text-blue-500 text-xs"></i><span>${statusInfo.practiceScore} / 5 分</span>` : '<span class="text-[11px]">未评分</span>'}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Footer Stats & Action -->
                        <div class="mt-2 pt-3 border-t border-slate-100">
                            <div class="flex items-center justify-between text-[11px] text-slate-400 font-medium mb-3">
                                <span class="flex items-center gap-1">
                                    <i class="ph ph-chat-circle-text text-[#2563EB]"></i>
                                    <span>${exCount} 个例句</span>
                                </span>
                                <span class="flex items-center gap-1">
                                    <i class="ph ph-pencil-simple-line text-indigo-500"></i>
                                    <span>${practiceCount} 道练习</span>
                                </span>
                            </div>
                            ${actionBtn}
                        </div>
                    </div>

                                        title="下一句 (快捷键 →)"

        function renderThaiHighlighter(text, parsed) {
            const normalizedText = text.normalize('NFC');
            const ranges = [];
            for (const [slot, value] of Object.entries(parsed)) {
                if (!value) continue;
                const normalizedValue = value.normalize('NFC');
                const idx = normalizedText.indexOf(normalizedValue);
                if (idx !== -1) {
                    ranges.push({ slot, start: idx, end: idx + normalizedValue.length, value: normalizedValue });
                }
            }
            ranges.sort((a, b) => a.start - b.start);
            
            let html = '<div class="thai-text font-thai select-text">';
            let cursor = 0;
            for (const range of ranges) {
                if (range.start > cursor) {
                    html += `<span>${normalizedText.slice(cursor, range.start)}</span>`;
                }
                html += `<span class="token-${range.slot} font-bold rounded px-1" style="background: ${getSlotColor(range.slot)}; border-bottom: 2px solid ${getSlotBorderColor(range.slot)}" title="${getSlotLabel(range.slot)}">${range.value}</span>`;
                cursor = range.end;
            }
            if (cursor < normalizedText.length) {
                html += `<span>${normalizedText.slice(cursor)}</span>`;
            }
            html += '</div>';
            return html;
        }

        function getSlotBorderColor(slot) {
            const borders = {
                subject: '#38bdf8',
                verb: '#f43f5e',
                action: '#f43f5e',
                purpose: '#3b82f6',
                prepositional_phrase: '#3b82f6'
            };
            return borders[slot] || '#cbd5e1';
        }

        // Selection event listener for floating query dialog bubble

            const selection = window.getSelection();
            if (selection.isCollapsed) {
                selectionToolbar.classList.add('hidden');

            }
            const text = selection.toString().trim();
            if (!text) {
                selectionToolbar.classList.add('hidden');
                return;
            }

            const range = selection.getRangeAt(0);
            const ancestorNode = range.commonAncestorContainer;
            const ancestorEl = ancestorNode.nodeType === Node.ELEMENT_NODE ? ancestorNode : ancestorNode.parentElement;

            const workspaceArea = document.getElementById('workspaceArea');
            const sidebarArea = document.getElementById('querySidebar');
            
            const inWorkspace = workspaceArea && workspaceArea.contains(ancestorEl);
            const inSidebar = sidebarArea && sidebarArea.contains(ancestorEl);
            const hasThai = /[\u0e00-\u0e7f]/.test(text);

            if (inWorkspace && !inSidebar && hasThai) {
                state.selectedText = text;
                const rect = range.getBoundingClientRect();
                const toolbarW = 100;
                const toolbarH = 34;
                const left = rect.left + rect.width / 2 - toolbarW / 2;
                const top = rect.top - toolbarH - 8;
                
                selectionToolbar.style.left = `${Math.max(10, Math.min(left, window.innerWidth - toolbarW - 10))}px`;
                selectionToolbar.style.top = `${Math.max(10, Math.min(top, window.innerHeight - toolbarH - 10)) + window.scrollY}px`;
                selectionToolbar.classList.remove('hidden');
            } else {
                selectionToolbar.classList.add('hidden');
            }
        });

        async function handleQuery(word) {
            if (!word) return;
            
            toggleSidebarState(true);
            sidebarEmptyState.classList.add('hidden');
            sidebarListContainer.classList.remove('hidden');

            const loaderId = 'loader-' + Date.now();
            const loaderHtml = `
                <div id="${loaderId}" class="bg-slate-50 border border-slate-100 rounded-xl p-4 shadow-sm relative animate-pulse flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-bold text-slate-800 font-thai">${word}</span>
                        <span class="text-[10px] text-slate-400 font-sans">正在查询...</span>
                    </div>
                    <div class="h-3 bg-slate-200 rounded w-3/4 mt-2"></div>
                    <div class="h-3 bg-slate-200 rounded w-1/2 mt-1"></div>
                </div>
            `;
            sidebarListContainer.insertAdjacentHTML('afterbegin', loaderHtml);
            sidebarListContainer.scrollTop = 0;

            try {
                const res = await fetch("https://thai-semantic-match-worker.alexszhang.workers.dev/explain", {
                    method: "POST",
                    headers: getWorkerAuthHeaders(),
                    body: JSON.stringify({ word })
                });
                if (res.status === 401) {
                    throw new Error("401 未授权访问：请检查 API Auth Token 是否正确！");
                }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const resText = await res.text();
                const explanations = resText ? JSON.parse(resText) : [];
                
                await saveQueryRecord(word, explanations);
                
                const loader = document.getElementById(loaderId);
                if (loader) loader.remove();
                
                await loadHistoryLogs();
            } catch (e) {
                console.error(e);
                const loader = document.getElementById(loaderId);
                if (loader) {
                    loader.classList.remove('animate-pulse');
                    loader.className = "bg-red-50 border border-red-100 rounded-xl p-4 shadow-sm relative";
                    let errorMsg = e.message || '网络请求失败';
                    if (errorMsg.includes('Failed to fetch') || errorMsg.includes('CORS')) {
                        errorMsg = "CORS 预检失败：可能是 Worker 端响应头未允许 Authorization 请求头。若后端未开启鉴权，请清空 Token 框重试。";
                    }
                    loader.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-bold text-[#DC2626] font-thai">${word}</span>
                            <span class="text-[10px] text-red-550">查询失败</span>
                        </div>
                        <p class="text-[10px] text-red-650 mt-1 border-t pt-1 border-red-100">${errorMsg}</p>
                    `;
                }
            }
        }

        const TOKEN_STORAGE_KEY = 'workerai_auth_token';

        function getWorkerAuthHeaders(extraHeaders = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...extraHeaders
            };
            const inputEl = document.getElementById('workerAuthToken');
            const token = (inputEl ? inputEl.value : (localStorage.getItem(TOKEN_STORAGE_KEY) || '')).trim();
            if (token && token.length > 0) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            return headers;
        }

        function clearWorkerAuthToken() {
            const inputEl = document.getElementById('workerAuthToken');
            if (inputEl) inputEl.value = '';
            localStorage.removeItem(TOKEN_STORAGE_KEY);
        }

        function initWorkerAuthTokenSync() {
            const inputEl = document.getElementById('workerAuthToken');
            if (!inputEl) return;
            inputEl.value = localStorage.getItem(TOKEN_STORAGE_KEY) || '';
            inputEl.addEventListener('input', () => {
                localStorage.setItem(TOKEN_STORAGE_KEY, inputEl.value.trim());
            });
        }
        document.addEventListener('DOMContentLoaded', initWorkerAuthTokenSync);

                                ${item.explanations && item.explanations.length > 0 ? item.explanations.map(exp => `

                                        <span class="text-[9px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-black flex-shrink-0 font-sans">译</span>
                                        <span class="text-slate-755 font-medium text-xs font-sans">${exp.meanCh}</span>
                                        <span class="text-[10px] text-slate-400 font-sans font-normal">(${exp.meanEn})</span>
                                    </div>
                                `).join('') : `<p class="text-xs text-slate-400 italic">暂无翻译说明</p>`}
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                sidebarEmptyState.classList.remove('hidden');
                sidebarListContainer.classList.add('hidden');
                sidebarListContainer.innerHTML = '';
            }
        }

        window.handleDeleteHistoryItem = async (e, id) => {
            e.stopPropagation();
            if (confirm("确定要删除这条查询词吗？")) {
                await deleteQueryRecord(id);
                await loadHistoryLogs();
            }
        };

        // ==========================================
        // Modal dialog logs window triggers
        // ==========================================
        document.getElementById('openHistoryBtn').addEventListener('click', async () => {
            await renderHistoryInDialog();
            historyDialog.showModal();
        });

        closeHistoryDialogBtn.addEventListener('click', () => historyDialog.close());
        closeHistoryFooterBtn.addEventListener('click', () => historyDialog.close());

        historyDialog.addEventListener('click', (e) => {
            const rect = historyDialog.getBoundingClientRect();
            const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height &&
                rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
            if (!isInDialog) {
                historyDialog.close();
            }
        });

        if (settingsDialog) {
            settingsDialog.addEventListener('click', (e) => {
                const rect = settingsDialog.getBoundingClientRect();
                const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height &&
                    rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
                if (!isInDialog) {
                    settingsDialog.close();
                }
            });
        }
        
        clearHistoryBtn.addEventListener('click', async () => {
            if (confirm("确定要清空所有的历史记录吗？")) {
                await clearQueryHistory();
                await renderHistoryInDialog();
                await loadHistoryLogs();
            }
        });

        async function renderHistoryInDialog() {
            const history = await getQueryHistory();
            if (!history || history.length === 0) {
                dialogHistoryList.innerHTML = `
                    <div class="text-center py-20 text-slate-400">
                        <i class="ph ph-clock-counter-clockwise text-4xl mb-2 text-slate-355"></i>
                        <p class="text-xs">暂无单词查询历史记录</p>
                    </div>
                `;
                return;
            }

            dialogHistoryList.innerHTML = history.map(item => `
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-inner flex justify-between items-start gap-4">
                    <div class="space-y-1">
                        <h4 class="text-sm font-bold text-slate-800 font-thai flex items-center gap-2 cursor-pointer hover:text-[#2563EB]" onclick="playAudioDirect('${item.word.replace(/'/g, "\\'")}')">
                            ${item.word}
                            <i class="fas fa-volume-up text-xs text-slate-400"></i>
                        </h4>
                        <div class="space-y-1 pt-1.5">
                            ${item.explanations && item.explanations.map(exp => `
                                <div class="text-xs text-slate-600 flex items-baseline gap-1.5 leading-relaxed">
                                    <span class="text-[9px] bg-blue-100 text-blue-700 px-1 py-0.5 rounded font-black shrink-0">译</span>
                                    <span>${exp.meanCh} (${exp.meanEn})</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-2 shrink-0 font-sans">
                        <span class="text-[10px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">${new Date(item.timestamp).toLocaleDateString()}</span>
                        <button onclick="deleteDialogHistoryItem(event, ${item.id})" class="text-xs text-[#DC2626] hover:text-[#DC2626] font-semibold flex items-center gap-1">
                            <i class="ph ph-trash"></i>
                            <span>删除</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.deleteDialogHistoryItem = async (e, id) => {
            e.stopPropagation();
            if (confirm("确定要删除此查询历史记录吗？")) {
                await deleteQueryRecord(id);
                await renderHistoryInDialog();
                await loadHistoryLogs();
            }
        };

        // --- Helper Components color maps ---
        function initPracticeEvents() {
            // Drag and drop inputs event bindings could go here if needed,
            // however inline onclick handlers handle most dynamic triggers.
        }

        // Standard lookup helpers
        function getSlotLabel(slot) {
            const labels = {
                subject: "主语",
                verb: "核心动词",
                action: "主要动作",
                purpose: "目的动作",
                prepositional_phrase: "方位/介词短语"
            };
            return labels[slot] || slot;
        }

        function getSlotColor(slot) {
            const colors = {
                subject: '#e0f2fe',
                verb: '#fee2e2',
                action: '#fee2e2',
                purpose: '#dbeafe',
                prepositional_phrase: '#dbeafe'
            };
            return colors[slot] || '#f1f5f9';
        }

        // --- Left Sidebar Collapse / Expand Toggle ---
        window.toggleLeftSidebar = () => {
            const sidebar = document.getElementById('leftSidebar');
            const icon = document.getElementById('leftSidebarToggleIcon');
            const btn = document.getElementById('toggleLeftSidebarBtn');
            if (!sidebar) return;
            const isCollapsed = sidebar.classList.toggle('collapsed');
            if (icon) {
                if (isCollapsed) {
                    icon.className = "ph-bold ph-sidebar-simple text-base text-blue-600";
                    if (btn) btn.classList.add('bg-blue-50', 'text-blue-600');
                } else {
                    icon.className = "ph-bold ph-sidebar-simple text-base text-slate-500";
                    if (btn) btn.classList.remove('bg-blue-50', 'text-blue-600');
                }
            }
            try {
                localStorage.setItem('sentence_coach_sidebar_collapsed', isCollapsed ? 'true' : 'false');
            } catch (e) {}
        };

        function initLeftSidebarState() {
            try {
                if (localStorage.getItem('sentence_coach_sidebar_collapsed') === 'true') {
                    const sidebar = document.getElementById('leftSidebar');
                    const icon = document.getElementById('leftSidebarToggleIcon');
                    const btn = document.getElementById('toggleLeftSidebarBtn');
                    if (sidebar) sidebar.classList.add('collapsed');
                    if (icon) icon.className = "ph-bold ph-sidebar-simple text-base text-blue-600";
                    if (btn) btn.classList.add('bg-blue-50', 'text-blue-600');
                }
            } catch (e) {}
        }

        // Global Keyboard Shortcut: ArrowLeft / ArrowRight for navigating examples in Step 2
        document.addEventListener('keydown', (e) => {
            if (state.currentStep === 2 && state.selectedPattern && state.selectedPattern.examples && state.selectedPattern.examples.length > 1) {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                if (e.key === 'ArrowLeft') {
                    goToPrevExample();
                } else if (e.key === 'ArrowRight') {
                    goToNextExample();
                }
            }
        });

        // Initialize App
        initLeftSidebarState();
        initFetch();
        loadHistoryLogs();
    </script>
</body>
</html>
