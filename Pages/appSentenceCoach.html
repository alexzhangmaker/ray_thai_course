<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰语句型教练 - vCourse.ThaiNotes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        thaiBlue: '#2563EB',      // Primary (#2563EB)
                        thaiGreen: '#16A34A',     // Success (#16A34A)
                        thaiRed: '#DC2626',       // Danger/Warning (#DC2626)
                        bgMain: '#F1F5F9',        // Main bg (#F1F5F9)
                        bgCard: '#FFFFFF',        // Card bg (#FFFFFF)
                        borderGrey: '#E2E8F0',    // Separator (#E2E8F0)
                        textMain: '#1E293B',      // Main text (#1E293B)
                        textSec: '#64748B',       // Secondary (#64748B)
                        textMuted: '#94A3B8'      // Muted (#94A3B8)
                    },
                    fontFamily: {
                        sans: ['"Outfit"', '"Noto Serif Thai"', '"Noto Sans SC"', 'sans-serif'],
                        thai: ['"Noto Serif Thai"', '"Noto Sans Thai"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', 'Noto Serif Thai', 'Noto Sans SC', sans-serif;
            background-color: #F1F5F9;
            height: 100vh;
            overflow: hidden;
        }

        #selectionToolbar {
            position: absolute;
            z-index: 50;
            background-color: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(51, 65, 85, 0.8);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
        }

        #querySidebar {
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.05);
        }

        .writing-mode-vertical {
            writing-mode: vertical-rl;
            text-combine-upright: all;
        }

        .font-thai {
            font-family: 'Noto Serif Thai', 'Noto Sans Thai', sans-serif;
        }

        .font-thai-clickable {
            cursor: pointer;
            transition: color 0.15s ease-in-out;
        }
        .font-thai-clickable:hover {
            color: #2563EB;
        }
        .font-thai-clickable:hover .fa-volume-up {
            color: #2563EB;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom scrollbars */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.02);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(37, 99, 235, 0.15);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(37, 99, 235, 0.3);
        }

        /* Desktop Layout Spacing & Card System */
        .card {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            border: 1px solid #E2E8F0;
        }
        .card-title-helper {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        /* Thai Text formatting */
        .thai-text {
            font-size: 1.6rem;
            line-height: 2.2;
            font-weight: 500;
            margin-bottom: 16px;
        }
        /* Question body styling matching 17px, line height 1.7, dark grey */
        .question-body {
            font-size: 17px;
            color: #2C3E50;
            line-height: 1.7;
            font-weight: 500;
        }
        .token-subject {
            background: linear-gradient(120deg, #e0f2fe 0%, #fee2e2 100%);
            border-bottom: 2px solid #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .token-verb, .token-action {
            background: linear-gradient(120deg, #fee2e2 0%, #fce7f3 100%);
            border-bottom: 2px solid #f43f5e;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }
        .token-purpose, .token-prepositional_phrase {
            background: linear-gradient(120deg, #dbeafe 0%, #e0f2fe 100%);
            border-bottom: 2px solid #3b82f6;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .token-subject:hover, .token-verb:hover, .token-action:hover, .token-purpose:hover, .token-prepositional_phrase:hover {
            transform: scale(1.02);
        }
        
        /* Exercise Core Layout Inputs */
        .exercise-input, .exercise-textarea {
            width: 100%;
            height: 48px; /* input height 48px */
            padding: 12px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            font-size: 16px; /* input font 16px */
            margin: 12px 0 16px 0;
            transition: all 0.2s;
            font-family: inherit;
        }
        .exercise-textarea { min-height: 80px; height: auto; }
        .exercise-input:focus, .exercise-textarea:focus {
            outline: none;
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .exercise-btn {
            background: #2563EB;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 40px;
        }
        .exercise-btn:hover { background: #1D4ED8; }
        .exercise-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .exercise-btn.secondary { 
            background: transparent; 
            border: 1.5px solid #64748B; 
            color: #1E293B; 
        }
        .exercise-btn.secondary:hover { background: #F1F5F9; }
        
        .feedback {
            padding: 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 15px;
            line-height: 1.5;
        }
        .feedback.success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
        .feedback.error { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
        .feedback.partial { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
        
        .hint-box {
            background: #FFFBEB;
            border-left: 4px solid #F59E0B;
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            line-height: 1.5;
            color: #78350F;
        }

        /* Red Wavy Underline for Error Correction */
        .wavy-underline {
            text-decoration: underline wavy #DC2626;
            text-decoration-thickness: 1.5px;
            text-underline-offset: 6px;
        }

        /* Chips styling */
        .word-builder-zone {
            min-height: 60px;
            background: #F8FAFC;
            border: 2px dashed #CBD5E1;
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .word-block {
            background: white;
            border: 1px solid #CBD5E1;
            color: #1E293B;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.15s;
            user-select: none;
        }
        .word-block:hover {
            border-color: #2563EB;
            color: #2563EB;
        }
        .word-block.in-selected {
            background: #2563EB;
            border-color: #2563EB;
            color: white;
        }

        /* Multiple Choice items */
        .mc-option {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.15s;
            text-align: left;
            width: 100%;
            display: flex;
            align-items: center;
        }
        .mc-option:hover:not(:disabled) {
            border-color: #2563EB;
            background: #eff6ff;
            color: #2563EB;
        }
        .mc-option.selected {
            border-color: #2563EB;
            background: #eff6ff;
            color: #2563EB;
        }
        .mc-option.correct {
            border-color: #16A34A;
            background: #D1FAE5;
            color: #065F46;
        }
        .mc-option.wrong {
            border-color: #DC2626;
            background: #FEE2E2;
            color: #991B1B;
        }

        #leftSidebar {
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }
        #leftSidebar.collapsed {
            margin-left: -280px;
            opacity: 0;
            pointer-events: none;
        }

        .pattern-nav-btn {
            transition: all 0.15s ease-out;
        }
        .pattern-nav-btn .pattern-title-wrap {
            min-width: 0;
        }
        .pattern-nav-btn:hover .pattern-name-text {
            white-space: normal;
            word-break: break-word;
            overflow: visible;
            text-overflow: clip;
        }
    </style>
</head>
<body class="text-slate-800 bg-[#F1F5F9] flex overflow-hidden">

    <!-- Floating Word Query Bubble -->
    <div id="selectionToolbar" class="rounded-full px-4 py-2 text-white items-center select-none hidden">
        <button id="floatingQueryBtn" class="flex items-center gap-1.5 hover:text-blue-300 transition text-xs font-semibold">
            <i class="fas fa-search text-[10px]"></i> 查询单词
        </button>
    </div>

    <!-- Left Column: Fixed Navigation Sidebar (280px) -->
    <aside id="leftSidebar" class="w-[280px] bg-white border-r border-[#E2E8F0] p-6 flex flex-col h-full shrink-0 overflow-y-auto custom-scrollbar">
        <!-- Logo & Title -->
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-xs shrink-0">
                <i class="ph ph-tree-structure text-xl"></i>
            </div>
            <div>
                <h1 class="text-[28px] font-bold text-[#1A1A1A] leading-tight font-sans">句型教练</h1>
                <p class="text-[10px] text-slate-500 font-medium tracking-wide uppercase">SentenceCoach</p>
            </div>
        </div>

        <!-- Progress Overview -->
        <div class="bg-[#F8FAFC] border border-[#E2E8F0] p-4 rounded-xl mb-6">
            <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-1.5">
                <span>总课程学习进度</span>
                <span id="globalProgressPercent">0%</span>
            </div>
            <div class="w-full bg-[#E2E8F0] h-2 rounded-full overflow-hidden">
                <div id="globalProgressBar" class="bg-[#2563EB] h-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Action Buttons: History & Settings -->
        <div class="grid grid-cols-2 gap-2 mb-6">
            <button id="openHistoryBtn" class="flex items-center justify-center gap-1.5 bg-slate-100 hover:bg-slate-200 py-2.5 rounded-xl text-xs font-semibold text-slate-700 transition cursor-pointer">
                <i class="ph ph-clock-counter-clockwise text-base text-slate-500"></i>
                <span>查词历史</span>
            </button>
            <button id="openSettingsSidebarBtn" onclick="openSettingsModal()" class="flex items-center justify-center gap-1.5 bg-slate-100 hover:bg-slate-200 py-2.5 rounded-xl text-xs font-semibold text-slate-700 transition cursor-pointer">
                <i class="ph ph-gear text-base text-slate-500"></i>
                <span>设置</span>
            </button>
        </div>

        <!-- Folding Course Accordion Container -->
        <div id="courseAccordionContainer" class="flex-grow space-y-4">
            <!-- Rendered dynamically -->
        </div>
    </aside>

    <!-- Right Column: Main content display panel -->
    <main class="flex-grow flex flex-col h-full overflow-hidden bg-[#F1F5F9] p-8 relative">
        
        <!-- Header / Breadcrumbs Bar -->
        <div class="flex items-center justify-between mb-4 shrink-0 select-none font-sans">
            <div class="flex items-center gap-2">
                <!-- Left Navigation Toggle Button (Placed to the left of "首页") -->
                <button 
                    id="toggleLeftSidebarBtn" 
                    onclick="toggleLeftSidebar()"
                    class="p-1.5 -ml-1 text-slate-500 hover:text-slate-800 hover:bg-slate-200/70 rounded-lg transition duration-150 flex items-center justify-center cursor-pointer"
                    title="展开/收起左侧导航"
                >
                    <i class="ph-bold ph-sidebar-simple text-base" id="leftSidebarToggleIcon"></i>
                </button>

                <!-- Breadcrumbs Navigation Trail -->
                <div id="breadcrumbTrail" class="text-xs text-[#64748B] flex items-center gap-1.5 font-medium">
                    <span class="cursor-pointer hover:underline" onclick="resetToHome()">首页</span>
                </div>
            </div>

            <!-- Global Action Buttons (Settings, etc.) -->
            <div class="flex items-center gap-2">
                <button 
                    id="openSettingsBtn"
                    onclick="openSettingsModal()"
                    class="flex items-center gap-1.5 px-3.5 py-1.5 bg-white hover:bg-slate-100 text-slate-700 font-semibold text-xs rounded-xl border border-slate-200 shadow-2xs transition active:scale-95 cursor-pointer"
                    title="应用设置"
                >
                    <i class="ph-bold ph-gear text-sm text-[#2563EB]"></i>
                    <span>设置</span>
                </button>
            </div>
        </div>

        <!-- Lower Panel: Workspace Learning Area (Scrollable) -->
        <div id="workspaceArea" class="flex-grow overflow-y-auto custom-scrollbar space-y-6 pr-2">
            <!-- Empty state layout -->
            <div class="text-center py-20 flex flex-col items-center card">
                <div class="h-16 w-16 bg-blue-50 border border-blue-100 rounded-2xl flex items-center justify-center mb-4 text-[#2563EB] text-3xl shadow-inner">
                    🏫
                </div>
                <h2 class="text-xl font-bold text-slate-800">欢迎进入泰语句型教练</h2>
                <p class="text-xs text-slate-500 mt-2 leading-relaxed max-w-md mx-auto">
                    请在左侧导航栏展开科目，并选择一个课时。我们将为你加载该章节下所有关联的泰语句型，进入交互式公式理解与练习。
                </p>
            </div>
        </div>

    </main>

    <!-- Sidebar: Right query dictionary toggler -->
    <aside 
        id="querySidebar" 
        class="h-full bg-white border-l border-[#E2E8F0] flex flex-col transition-all duration-300 shrink-0 relative overflow-visible w-0"
    >
        <!-- Toggle button: floats at the left edge of the sidebar -->
        <button 
            id="toggleQuerySidebarBtn"
            class="absolute left-0 top-1/3 -translate-x-full bg-[#2563EB] text-white py-4 px-2.5 rounded-l-xl shadow-xl hover:bg-blue-700 transition flex flex-col items-center gap-1.5 border border-r-0 border-blue-400 select-none cursor-pointer z-50"
        >
            <i class="fas fa-chevron-left transition-transform duration-300" id="querySidebarToggleIcon"></i>
            <span class="text-[10px] font-black tracking-widest writing-mode-vertical mt-0.5">生词释义</span>
        </button>

        <!-- Inner contents -->
        <div class="w-80 md:w-96 flex flex-col h-full overflow-hidden opacity-0 pointer-events-none transition-opacity duration-200" id="querySidebarInner">
            <div class="p-5 border-b border-[#E2E8F0] flex justify-between items-center bg-gray-50 flex-shrink-0">
                <h3 class="text-sm font-bold text-gray-800 flex items-center font-sans">
                    <i class="ph-fill ph-book-open text-[#2563EB] mr-2 text-lg"></i>
                    <span>生词查询</span>
                </h3>
                <button id="closeQuerySidebarBtn" class="text-gray-400 hover:text-gray-600 p-1 cursor-pointer">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>

            <!-- Manual query -->
            <div class="p-4 border-b border-gray-100 bg-white flex-shrink-0 font-sans space-y-2.5">
                <div class="flex items-center gap-2">
                    <div class="flex items-center gap-1.5 text-[11px] text-slate-500 font-semibold shrink-0">
                        <i class="ph ph-key text-blue-600"></i>
                        <span>Auth Token:</span>
                    </div>
                    <input 
                        type="password" 
                        id="workerAuthToken" 
                        placeholder="Worker AI 访问密钥 (Bearer Token)" 
                        autocomplete="off"
                        class="w-full text-[11px] bg-slate-50 border border-gray-200 rounded-lg px-2.5 py-1 focus:outline-none focus:border-blue-500 font-mono text-slate-700 placeholder-slate-400"
                    />
                </div>
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <input 
                            type="text" 
                            id="manualQueryInput"
                            placeholder="手动查询泰语生词..." 
                            class="w-full text-xs bg-slate-50 border border-gray-200 rounded-xl pl-8 pr-3 py-2.5 focus:outline-none focus:border-[#2563EB]"
                        />
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
                    </div>
                    <button 
                        id="manualQueryBtn"
                        class="bg-[#2563EB] hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-xl transition active:scale-95 flex items-center justify-center shrink-0"
                    >
                        查询
                    </button>
                </div>
            </div>

            <!-- Search logs list -->
            <div id="sidebarListContainer" class="flex-grow overflow-y-auto p-4 space-y-4 custom-scrollbar"></div>

            <!-- Empty state -->
            <div id="sidebarEmptyState" class="flex-grow flex flex-col items-center justify-center p-6 text-slate-455 text-center select-none font-sans bg-white">
                <i class="fas fa-search text-3xl mb-3 text-slate-300"></i>
                <p class="text-xs">在句型中双击或选中任何泰语词汇</p>
                <p class="text-xs mt-1">并在弹出的气泡中点击</p>
                <p class="text-xs font-bold text-[#2563EB] mt-1">“查询单词”</p>
            </div>
        </div>
    </aside>

    <!-- Query Dialog dialog modal -->
    <dialog id="historyDialog" class="rounded-2xl shadow-2xl p-0 border border-slate-100 max-w-lg w-full backdrop:bg-black/50 overflow-hidden">
        <div class="flex flex-col h-[500px] bg-white font-sans">
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="ph ph-clock text-blue-650 text-xl"></i>
                    <span>生词查询历史记录</span>
                </h3>
                <button id="closeHistoryDialogBtn" class="text-slate-455 hover:text-slate-750 p-1 cursor-pointer">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>

            <div class="p-6 flex-grow overflow-y-auto space-y-4 bg-slate-50/50 custom-scrollbar" id="dialogHistoryList">
                <!-- Loaded dynamically -->
            </div>

            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center shrink-0">
                <button id="clearHistoryBtn" class="text-[#DC2626] hover:text-red-800 text-xs font-semibold flex items-center gap-1">
                    <i class="ph ph-trash"></i>
                    <span>清空历史记录</span>
                </button>
                <button id="closeHistoryFooterBtn" class="bg-[#2563EB] text-white px-5 py-2 rounded-xl hover:bg-blue-700 text-xs font-bold shadow-md shadow-blue-500/25 active:scale-95 transition">
                    关闭
                </button>
            </div>
        </div>
    </dialog>

    <!-- App Settings Dialog modal -->
    <dialog id="settingsDialog" class="rounded-2xl shadow-2xl p-0 border border-slate-100 max-w-lg w-full backdrop:bg-black/50 overflow-hidden font-sans">
        <div class="flex flex-col bg-white">
            <!-- Modal Header -->
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h3 class="font-bold text-slate-800 flex items-center gap-2 text-base">
                    <i class="ph-bold ph-gear text-[#2563EB] text-xl"></i>
                    <span>句型教练偏好设置</span>
                </h3>
                <button id="closeSettingsDialogBtn" onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>

            <!-- Modal Content -->
            <div class="p-6 space-y-4">
                <!-- Toggle: Review Step 3 Practice -->
                <div class="flex items-center justify-between p-4 bg-slate-50 border border-slate-200/80 rounded-2xl hover:border-blue-200 transition">
                    <div class="space-y-1 pr-4">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-slate-800">复习句型时包含第3步（交互练习）</span>
                        </div>
                        <p class="text-xs text-slate-500 leading-relaxed">
                            默认关闭。关闭时，复习已完成句型将跳过交互练习，完成例句学习后可直接进入下一个句型。
                        </p>
                    </div>
                    <!-- Switch Toggle -->
                    <label class="relative inline-flex items-center cursor-pointer select-none shrink-0">
                        <input type="checkbox" id="settingShowReviewStep3" class="sr-only peer" onchange="handleSettingChange('showReviewStep3', this.checked)">
                        <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#2563EB]"></div>
                    </label>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center shrink-0">
                <span class="text-[11px] text-slate-400 flex items-center gap-1">
                    <i class="ph ph-database text-xs"></i>
                    <span>配置已存储至本地 IndexedDB</span>
                </span>
                <button onclick="closeSettingsModal()" class="bg-[#2563EB] text-white px-5 py-2 rounded-xl hover:bg-blue-700 text-xs font-bold shadow-md shadow-blue-500/25 active:scale-95 transition cursor-pointer">
                    完成
                </button>
            </div>
        </div>
    </dialog>


    <!-- Pure Javascript App Logic -->
    <script>
        // Global Application State
        const state = {
            courses: [],
            lessons: [],
            allPatterns: [],        // All sentence pattern records
            coursePatterns: [],     // All course-sentence-pattern associations
            selectedCourseId: null,
            selectedLessonId: null,
            selectedPattern: null,  // Active pattern object (CEFR patternContent)
            currentExampleIndex: 0, // Active example card index in Step 2
            expandedCourses: {},    // Tracks expanded course accordions in sidebar
            expandedLessons: {},    // Tracks expanded lesson accordions in sidebar
            activeTab: 'examples',   // examples, practice, json
            queryHistory: [],
            querySidebarOpen: false,
            selectedText: ''
        };

        // Cache user answer state dynamically
        const userProgress = {};

        // App Settings Configuration
        const defaultSettings = {
            showReviewStep3: false // 控制复习句型时的第三步是否显示的开关，默认状态是关闭
        };
        let appSettings = { ...defaultSettings };

        // DOM references
        const courseAccordionContainer = document.getElementById('courseAccordionContainer');
        const breadcrumbTrail = document.getElementById('breadcrumbTrail');
        const workspaceArea = document.getElementById('workspaceArea');

        const querySidebar = document.getElementById('querySidebar');
        const querySidebarInner = document.getElementById('querySidebarInner');
        const toggleQuerySidebarBtn = document.getElementById('toggleQuerySidebarBtn');
        const querySidebarToggleIcon = document.getElementById('querySidebarToggleIcon');
        const closeQuerySidebarBtn = document.getElementById('closeQuerySidebarBtn');
        const sidebarListContainer = document.getElementById('sidebarListContainer');
        const sidebarEmptyState = document.getElementById('sidebarEmptyState');
        const manualQueryInput = document.getElementById('manualQueryInput');
        const manualQueryBtn = document.getElementById('manualQueryBtn');

        const selectionToolbar = document.getElementById('selectionToolbar');
        const floatingQueryBtn = document.getElementById('floatingQueryBtn');

        const historyDialog = document.getElementById('historyDialog');
        const closeHistoryDialogBtn = document.getElementById('closeHistoryDialogBtn');
        const closeHistoryFooterBtn = document.getElementById('closeHistoryFooterBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const dialogHistoryList = document.getElementById('dialogHistoryList');

        const settingsDialog = document.getElementById('settingsDialog');

        // ==========================================
        // IndexedDB 存储逻辑 (查词历史 & 句型学习进度与自评 & 应用配置)
        // ==========================================
        const DB_NAME = 'ThaiReadingCoachDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'wordQueries';

        const SENTENCE_DB_NAME = 'SentenceCoachDB';
        const SENTENCE_DB_VERSION = 2;
        const SENTENCE_STORE_NAME = 'patternProgress';
        const SETTINGS_STORE_NAME = 'appSettings';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('sentenceTags')) {
                        const store = db.createObjectStore('sentenceTags', { keyPath: 'id' });
                        store.createIndex('articleId', 'articleId', { unique: false });
                        store.createIndex('article_paragraph_sentence', ['articleId', 'paragraphId', 'sentenceId'], { unique: false });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        function initSentenceDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(SENTENCE_DB_NAME, SENTENCE_DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(SENTENCE_STORE_NAME)) {
                        db.createObjectStore(SENTENCE_STORE_NAME, { keyPath: 'patternId' });
                    }
                    if (!db.objectStoreNames.contains(SETTINGS_STORE_NAME)) {
                        db.createObjectStore(SETTINGS_STORE_NAME, { keyPath: 'key' });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function loadAppSettingsFromDB() {
            try {
                const db = await initSentenceDB();
                return new Promise((resolve) => {
                    if (!db.objectStoreNames.contains(SETTINGS_STORE_NAME)) {
                        resolve(appSettings);
                        return;
                    }
                    const transaction = db.transaction([SETTINGS_STORE_NAME], 'readonly');
                    const store = transaction.objectStore(SETTINGS_STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = (e) => {
                        const records = e.target.result || [];
                        records.forEach(rec => {
                            if (rec && rec.key !== undefined) {
                                appSettings[rec.key] = rec.value;
                            }
                        });
                        syncSettingsUI();
                        resolve(appSettings);
                    };
                    request.onerror = () => resolve(appSettings);
                });
            } catch (err) {
                console.error('Failed to load settings from IndexedDB:', err);
                return appSettings;
            }
        }

        async function saveAppSettingToDB(key, value) {
            appSettings[key] = value;
            try {
                const db = await initSentenceDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([SETTINGS_STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(SETTINGS_STORE_NAME);
                    const putReq = store.put({ key, value, updatedAt: Date.now() });
                    putReq.onsuccess = () => resolve(true);
                    putReq.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to save setting to IndexedDB:', err);
            }
        }

        function syncSettingsUI() {
            const toggleShowReviewStep3 = document.getElementById('settingShowReviewStep3');
            if (toggleShowReviewStep3) {
                toggleShowReviewStep3.checked = !!appSettings.showReviewStep3;
            }
        }

        window.openSettingsModal = () => {
            syncSettingsUI();
            if (settingsDialog) settingsDialog.showModal();
        };

        window.closeSettingsModal = () => {
            if (settingsDialog) settingsDialog.close();
        };

        window.handleSettingChange = async (key, value) => {
            await saveAppSettingToDB(key, value);
            if (state.selectedPattern) {
                renderSidebar();
                renderWorkspace();
            }
        };

        async function loadAllPatternProgressFromDB() {
            try {
                const db = await initSentenceDB();
                return new Promise((resolve) => {
                    const transaction = db.transaction([SENTENCE_STORE_NAME], 'readonly');
                    const store = transaction.objectStore(SENTENCE_STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = (e) => {
                        const records = e.target.result || [];
                        records.forEach(rec => {
                            if (rec && rec.patternId) {
                                const pId = rec.patternId;
                                if (rec.exampleScore !== undefined && rec.exampleScore !== null) {
                                    userProgress[`${pId}-example-score`] = rec.exampleScore;
                                }
                                if (rec.practiceScore !== undefined && rec.practiceScore !== null) {
                                    userProgress[`${pId}-practice-score`] = rec.practiceScore;
                                }
                                if (rec.step1Done) userProgress[`${pId}-step1-done`] = true;
                                if (rec.step2Done) userProgress[`${pId}-step2-done`] = true;
                                if (rec.step3Done) userProgress[`${pId}-step3-done`] = true;
                                if (rec.isCompleted) userProgress[`${pId}-pattern-completed`] = true;
                            }
                        });
                        resolve(records);
                    };
                    request.onerror = () => resolve([]);
                });
            } catch (err) {
                console.error('Failed to load pattern progress from IndexedDB:', err);
                return [];
            }
        }

        async function savePatternProgressToDB(patternId, partialData) {
            try {
                const db = await initSentenceDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([SENTENCE_STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(SENTENCE_STORE_NAME);
                    const getReq = store.get(patternId);
                    getReq.onsuccess = () => {
                        const existing = getReq.result || { patternId };
                        const merged = { ...existing, ...partialData, updatedAt: Date.now() };
                        const putReq = store.put(merged);
                        putReq.onsuccess = () => resolve(true);
                        putReq.onerror = (e) => reject(e.target.error);
                    };
                    getReq.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to save pattern progress to IndexedDB:', err);
            }
        }

        async function savePatternScoreToDB(patternId, type, score) {
            const data = {};
            if (type === 'example') {
                data.exampleScore = score;
            } else if (type === 'practice') {
                data.practiceScore = score;
            }
            return savePatternProgressToDB(patternId, data);
        }

        async function savePatternStepToDB(patternId, step, isCompleted = false) {
            const data = {};
            if (step >= 1) data.step1Done = true;
            if (step >= 2) data.step2Done = true;
            if (step >= 3) data.step3Done = true;
            if (isCompleted) data.isCompleted = true;
            return savePatternProgressToDB(patternId, data);
        }

        async function saveQueryRecord(word, explanations) {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const record = { word, explanations, timestamp: Date.now() };
                    const request = store.add(record);
                    request.onsuccess = () => resolve(true);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to save query log:', err);
            }
        }

        async function getQueryHistory() {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readonly');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = (e) => {
                        const records = e.target.result || [];
                        records.sort((a, b) => b.timestamp - a.timestamp);
                        resolve(records);
                    };
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to load query log:', err);
                return [];
            }
        }

        async function deleteQueryRecord(id) {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve(true);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to delete query log:', err);
            }
        }

        async function clearQueryHistory() {
            try {
                const db = await initDB();
                return new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.clear();
                    request.onsuccess = () => resolve(true);
                    request.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error('Failed to clear query log:', err);
            }
        }

        // Helper: get patterns associated with a lesson
        function getPatternsForLesson(lessonId) {
            return state.allPatterns.filter(p => p.courses && p.courses.some(c => c.lessonId === lessonId));
        }

        // --- Fetch initial course directories & patterns ---
        async function initFetch() {
            try {
                // First load all saved settings, scores & progress from IndexedDB
                await Promise.all([
                    loadAppSettingsFromDB(),
                    loadAllPatternProgressFromDB()
                ]);

                const [resC, resL, resCSP, resP] = await Promise.all([
                    fetch('/api/courses'),
                    fetch('/api/lessons'),
                    fetch('/api/course_sentence_patterns'),
                    fetch('/api/sentence_patterns')
                ]);
                if (resC.ok && resL.ok) {
                    state.courses = await resC.json();
                    state.lessons = await resL.json();
                    if (resCSP && resCSP.ok) {
                        state.coursePatterns = await resCSP.json();
                    }
                    if (resP && resP.ok) {
                        state.allPatterns = await resP.json();
                    }

                    // Get lessons that have sentence patterns
                    const validLessonIds = new Set();
                    state.allPatterns.forEach(pat => {
                        if (pat.courses) {
                            pat.courses.forEach(c => validLessonIds.add(c.lessonId));
                        }
                    });
                    if (validLessonIds.size === 0 && state.coursePatterns) {
                        state.coursePatterns.forEach(cp => validLessonIds.add(cp.lesson_id));
                    }

                    const validCourses = state.courses.filter(c => 
                        state.lessons.some(l => l.course_id === c.id && validLessonIds.has(l.id))
                    );

                    // Check URL params
                    const params = new URLSearchParams(window.location.search);
                    const uuidParam = params.get('uuid') || params.get('patternID') || params.get('patternId');
                    const lessonIdParam = params.get('lessonID') || params.get('lessonId');
                    const courseIdParam = params.get('courseID') || params.get('courseId');

                    if (uuidParam) {
                        await loadPatternByUuid(uuidParam);
                    } else if (lessonIdParam) {
                        const lesson = state.lessons.find(l => l.id === lessonIdParam);
                        if (lesson) {
                            state.selectedCourseId = lesson.course_id;
                            state.selectedLessonId = lessonIdParam;
                            state.expandedCourses[lesson.course_id] = true;
                            state.selectedPattern = null;
                        }
                    } else if (courseIdParam) {
                        const course = state.courses.find(c => c.id === courseIdParam);
                        if (course) {
                            state.selectedCourseId = course.id;
                            state.expandedCourses[course.id] = true;
                            const firstLesson = state.lessons.find(l => l.course_id === course.id && validLessonIds.has(l.id)) || state.lessons.find(l => l.course_id === course.id);
                            if (firstLesson) {
                                state.selectedLessonId = firstLesson.id;
                                state.selectedPattern = null;
                            }
                        }
                    } else if (validCourses.length > 0) {
                        // Default expand first valid course & lesson in grid mode
                        const firstCourse = validCourses[0];
                        state.expandedCourses[firstCourse.id] = true;
                        const firstLesson = state.lessons.find(l => l.course_id === firstCourse.id && validLessonIds.has(l.id));
                        if (firstLesson) {
                            state.selectedCourseId = firstCourse.id;
                            state.selectedLessonId = firstLesson.id;
                            state.selectedPattern = null;
                        }
                    }
                }
            } catch (e) {
                console.error("Backend fetch error:", e);
            }
            renderSidebar();
            renderBreadcrumbs();
            renderWorkspace();
            calculateGlobalProgress();
        }

        // --- Calculate Sidebar & Global Course Progress ---
        function calculateGlobalProgress() {
            // Count completed exercises
            const totalSolved = Object.keys(userProgress).filter(k => k.endsWith('-submitted') || k.endsWith('-correct') || k.endsWith('-score') || k.endsWith('-pattern-completed')).length;
            const targetScore = totalSolved * 10; // Mock progress factor
            const progressPercent = Math.min(100, Math.round(targetScore > 0 ? (totalSolved / 25) * 100 : 0));
            
            const percentEl = document.getElementById('globalProgressPercent');
            const barEl = document.getElementById('globalProgressBar');
            if (percentEl) percentEl.innerText = `${progressPercent}%`;
            if (barEl) barEl.style.width = `${progressPercent}%`;
        }

        // --- Exercise & Progress Helpers ---
        function getPatternExerciseCount(p) {
            if (!p || !p.exercises) return 0;
            let count = 0;
            const ex = p.exercises;
            if (ex.recognition && ex.recognition.items) count += ex.recognition.items.length;
            if (ex.fillInBlank && ex.fillInBlank.items) count += ex.fillInBlank.items.length;
            if (ex.dragAndDrop && ex.dragAndDrop.items) count += ex.dragAndDrop.items.length;
            if (ex.multipleChoice && ex.multipleChoice.items) count += ex.multipleChoice.items.length;
            if (ex.translation && ex.translation.items) count += ex.translation.items.length;
            if (ex.sentenceConstruction && ex.sentenceConstruction.items) count += ex.sentenceConstruction.items.length;
            if (ex.errorCorrection && ex.errorCorrection.items) count += ex.errorCorrection.items.length;
            return count;
        }

        function getLessonStats(lessonId) {
            const lPats = getPatternsForLesson(lessonId);
            const total = lPats.length;
            let completed = 0;
            let inProgress = 0;
            lPats.forEach(pat => {
                const pId = pat.patternContent.id;
                if (userProgress[`${pId}-pattern-completed`]) {
                    completed++;
                } else if (userProgress[`${pId}-step1-done`] || userProgress[`${pId}-step2-done`]) {
                    inProgress++;
                }
            });
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            return {
                total,
                completed,
                inProgress,
                notStarted: Math.max(0, total - completed - inProgress),
                percent
            };
        }

        function getPatternStatus(patternId) {
            const isCompleted = !!userProgress[`${patternId}-pattern-completed`];
            const exampleScore = userProgress[`${patternId}-example-score`] !== undefined ? userProgress[`${patternId}-example-score`] : null;
            const practiceScore = userProgress[`${patternId}-practice-score`] !== undefined ? userProgress[`${patternId}-practice-score`] : null;

            if (isCompleted) {
                return { status: 'completed', label: '已完成', step: 3, exampleScore, practiceScore };
            }
            if (userProgress[`${patternId}-step2-done`]) {
                return { status: 'in_progress', label: '学习中 (第3步)', step: 3, exampleScore, practiceScore };
            }
            if (userProgress[`${patternId}-step1-done`]) {
                return { status: 'in_progress', label: '学习中 (第2步)', step: 2, exampleScore, practiceScore };
            }
            return { status: 'not_started', label: '未学习', step: 1, exampleScore, practiceScore };
        }

        function getScoreDescription(score) {
            switch(score) {
                case 0: return '完全未掌握，需重新学习';
                case 1: return '勉强看懂，需查阅词汇与结构';
                case 2: return '掌握基本结构，但需要提示';
                case 3: return '理解大部分内容，表达较熟练';
                case 4: return '掌握良好，能快速准确理解与运用';
                case 5: return '完全精通，地道流利无任何障碍';
                default: return '';
            }
        }

        function renderPatternSelfRatingCard(patternId, type) {
            const isExample = type === 'example';
            const currentScore = userProgress[`${patternId}-${type}-score`];
            const hasRated = currentScore !== undefined && currentScore !== null;
            const title = isExample ? '例句学习掌握度自评' : '交互练习测评表现自评';
            const subtitle = isExample 
                ? '请根据对本句型例句的理解程度和跟读熟练度进行自评打分（0-5分）' 
                : '请根据对本句型练习题的完成质量与掌握信心进行自评打分（0-5分）';
            const iconClass = isExample ? 'ph-chat-circle-dots text-amber-500' : 'ph-pencil-line text-blue-500';
            const badgeColor = isExample ? 'bg-amber-50 border-amber-200 text-amber-800' : 'bg-blue-50 border-blue-200 text-blue-800';

            return `
                <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-xs my-6 font-sans">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-xl shrink-0">
                                <i class="ph ${iconClass}"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h4 class="font-bold text-slate-800 text-base">${title}</h4>
                                    ${hasRated ? `
                                        <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border ${badgeColor}">
                                            当前自评: ${currentScore} / 5 分 ⭐
                                        </span>
                                    ` : `
                                        <span class="text-[11px] text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full font-medium">
                                            未自评
                                        </span>
                                    `}
                                </div>
                                <p class="text-xs text-slate-500 mt-1 leading-relaxed">${subtitle}</p>
                            </div>
                        </div>

                        <!-- 0-5 Rating Buttons -->
                        <div class="flex items-center gap-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-200 shrink-0 self-start md:self-auto flex-wrap">
                            ${[0, 1, 2, 3, 4, 5].map(score => {
                                const isSelected = hasRated && currentScore === score;
                                return `
                                    <button 
                                        onclick="setPatternScore('${patternId}', '${type}', ${score})"
                                        title="${score === 0 ? '0分 - 完全未掌握' : `${score}分 - ${getScoreDescription(score)}`}"
                                        class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer active:scale-95 ${
                                            isSelected 
                                                ? (isExample ? 'bg-amber-500 text-white shadow-sm shadow-amber-500/30' : 'bg-[#2563EB] text-white shadow-sm shadow-blue-500/30')
                                                : 'text-slate-600 hover:bg-white hover:text-slate-900 border border-transparent hover:border-slate-200'
                                        }"
                                    >
                                        <span>${score === 0 ? '0分' : `${score}分`}</span>
                                        ${score > 0 ? `<i class="ph-fill ph-star text-[11px] ${isSelected ? 'text-white' : 'text-amber-400'}"></i>` : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    ${hasRated ? `
                        <div class="mt-3.5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                            <span class="font-medium text-slate-700">评语参考：${getScoreDescription(currentScore)}</span>
                            <span class="text-[11px] text-emerald-600 flex items-center gap-1 font-semibold">
                                <i class="ph-fill ph-check-circle"></i>
                                <span>已保存至本地 IndexedDB</span>
                            </span>
                        </div>
                    ` : `
                        <div class="mt-3 pt-2.5 border-t border-slate-100 text-[11px] text-slate-400">
                            💡 点击上方 0-5 分完成打分，评分数据将自动存储在本地并同步呈现在卡片列表中。
                        </div>
                    `}
                </div>
            `;
        }

        window.setPatternScore = async (patternId, type, score) => {
            if (type === 'example') {
                userProgress[`${patternId}-example-score`] = score;
            } else if (type === 'practice') {
                userProgress[`${patternId}-practice-score`] = score;
            }
            await savePatternScoreToDB(patternId, type, score);
            renderWorkspace();
            renderSidebar();
        };

        // --- Render left sidebar (Course -> Lesson only) ---
        function renderSidebar() {
            const validLessonIds = new Set();
            state.allPatterns.forEach(pat => {
                if (pat.courses) {
                    pat.courses.forEach(c => validLessonIds.add(c.lessonId));
                }
            });
            if (validLessonIds.size === 0 && state.coursePatterns) {
                state.coursePatterns.forEach(cp => validLessonIds.add(cp.lesson_id));
            }

            const displayCourses = state.courses.filter(c => 
                state.lessons.some(l => l.course_id === c.id && validLessonIds.has(l.id))
            );

            if (displayCourses.length === 0) {
                courseAccordionContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">暂无包含句型的课程</p>';
                return;
            }

            courseAccordionContainer.innerHTML = displayCourses.map(course => {
                const cLessons = state.lessons.filter(l => l.course_id === course.id && validLessonIds.has(l.id));
                const isCourseExpanded = state.expandedCourses[course.id];
                
                // Calculate solved count in course
                const solvedInCourse = Object.keys(userProgress).filter(k => k.includes(course.id) && k.endsWith('-submitted')).length;
                const progressWidth = Math.min(100, Math.round((solvedInCourse / Math.max(1, cLessons.length * 3)) * 100));

                const lessonsListHtml = cLessons.map(lesson => {
                    const isLessonActive = state.selectedLessonId === lesson.id;
                    const lessonPatterns = getPatternsForLesson(lesson.id);
                    const stats = getLessonStats(lesson.id);
                    const isAllCompleted = stats.total > 0 && stats.completed === stats.total;

                    return `
                        <button 
                            onclick="selectLesson('${lesson.id}', '${course.id}')"
                            title="${(lesson.title || '').replace(/"/g, '&quot;')}"
                            class="w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium transition flex items-center justify-between font-sans cursor-pointer group ${
                                isLessonActive 
                                    ? 'bg-blue-50 text-[#2563EB] font-bold border border-blue-200/80 shadow-2xs' 
                                    : 'text-slate-700 hover:bg-slate-100 hover:text-slate-900 border border-transparent'
                            }"
                        >
                            <div class="flex items-center gap-2.5 min-w-0">
                                <i class="ph ${isAllCompleted ? 'ph-check-circle-fill text-emerald-500' : 'ph-file-text'} text-base shrink-0 ${isLessonActive && !isAllCompleted ? 'text-[#2563EB]' : (isAllCompleted ? 'text-emerald-500' : 'text-slate-400 group-hover:text-slate-600')}"></i>
                                <span class="truncate">${lesson.title}</span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${
                                    isLessonActive 
                                        ? 'bg-blue-200/60 text-[#2563EB] font-bold' 
                                        : (isAllCompleted ? 'bg-emerald-100 text-emerald-700 font-bold' : 'bg-slate-200/70 text-slate-500')
                                }">
                                    ${lessonPatterns.length} 句型
                                </span>
                                <i class="ph ph-caret-right text-xs shrink-0 ${isLessonActive ? 'text-[#2563EB]' : 'text-slate-300 group-hover:text-slate-400'}"></i>
                            </div>
                        </button>
                    `;
                }).join('');

                return `
                    <div class="border border-[#E2E8F0] rounded-xl overflow-hidden bg-white shadow-xs">
                        <button 
                            onclick="toggleCourseAccordion('${course.id}')" 
                            class="w-full flex flex-col p-4 bg-slate-50/50 hover:bg-slate-50 transition border-b border-[#E2E8F0] cursor-pointer"
                        >
                            <div class="w-full flex items-center justify-between">
                                <div class="flex items-center gap-2.5 text-left">
                                    <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-[#2563EB]">
                                        <i class="ph ph-folder-open text-base"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-[#2C3E50] text-[15px]">${course.name}</h3>
                                        <span class="text-[12px] text-[#7F8C8D] font-medium">${cLessons.length} 个课时</span>
                                    </div>
                                </div>
                                <i class="ph ph-caret-down transition-transform duration-300 text-slate-450 text-xs ${isCourseExpanded ? 'transform rotate-180' : ''}"></i>
                            </div>
                            <!-- Course card bottom progress bar -->
                            <div class="w-full bg-[#E2E8F0] h-1 rounded-full overflow-hidden mt-3.5">
                                <div class="bg-[#2563EB] h-full transition-all duration-300" style="width: ${progressWidth}%"></div>
                            </div>
                        </button>
                        
                        ${isCourseExpanded ? `
                            <div class="p-2 space-y-1 bg-white">
                                ${lessonsListHtml.length > 0 ? lessonsListHtml : '<p class="text-[10px] text-slate-400 text-center py-3">暂无课时</p>'}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        window.toggleCourseAccordion = (courseId) => {
            state.expandedCourses[courseId] = !state.expandedCourses[courseId];
            renderSidebar();
        };

        // --- Step-by-Step Workflow Helpers ---
        function getPatternMaxUnlockedStep(patternId) {
            const hideStep3 = !appSettings.showReviewStep3;
            if (hideStep3) {
                if (userProgress[`${patternId}-step1-done`] || userProgress[`${patternId}-pattern-completed`]) {
                    return 2;
                }
                return 1;
            }
            if (userProgress[`${patternId}-pattern-completed`] || userProgress[`${patternId}-step2-done`]) {
                return 3;
            }
            if (userProgress[`${patternId}-step1-done`]) {
                return 2;
            }
            return 1;
        }

        window.goToPatternStep = (stepNum) => {
            if (!state.selectedPattern) return;
            const pId = state.selectedPattern.id;
            const hideStep3 = !appSettings.showReviewStep3;
            if (stepNum === 3 && hideStep3) {
                return;
            }
            const maxStep = getPatternMaxUnlockedStep(pId);
            const isCompleted = !!userProgress[`${pId}-pattern-completed`];
            if (stepNum <= maxStep || isCompleted) {
                state.currentStep = stepNum;
                renderWorkspace();
            }
        };

        window.completeStep1 = async () => {
            if (!state.selectedPattern) return;
            const pId = state.selectedPattern.id;
            userProgress[`${pId}-step1-done`] = true;
            state.currentStep = 2;
            state.currentExampleIndex = 0;
            await savePatternStepToDB(pId, 1);
            renderSidebar();
            renderWorkspace();
        };

        window.completeStep2 = async () => {
            if (!state.selectedPattern) return;
            const pId = state.selectedPattern.id;
            userProgress[`${pId}-step1-done`] = true;
            userProgress[`${pId}-step2-done`] = true;

            const hideStep3 = !appSettings.showReviewStep3;
            if (hideStep3) {
                userProgress[`${pId}-pattern-completed`] = true;
                await savePatternStepToDB(pId, 2, true);
                renderSidebar();
                goToNextPattern();
                return;
            }

            await savePatternStepToDB(pId, 2, false);
            state.currentStep = 3;
            renderSidebar();
            renderWorkspace();
        };

        window.completeStep3 = async () => {
            if (!state.selectedPattern) return;
            const pId = state.selectedPattern.id;
            userProgress[`${pId}-step1-done`] = true;
            userProgress[`${pId}-step2-done`] = true;
            userProgress[`${pId}-step3-done`] = true;
            userProgress[`${pId}-pattern-completed`] = true;
            state.currentStep = 3;
            await savePatternStepToDB(pId, 3, true);
            renderSidebar();
            renderWorkspace();
        };

        window.goToPrevPattern = () => {
            if (!state.selectedPattern || !state.selectedLessonId) return;
            state.currentExampleIndex = 0;
            const currentLessonPatterns = getPatternsForLesson(state.selectedLessonId);
            const currentIdx = currentLessonPatterns.findIndex(p => p.patternContent.id === state.selectedPattern.id);
            if (currentIdx > 0) {
                const prevPat = currentLessonPatterns[currentIdx - 1];
                selectPattern(prevPat.uuid, state.selectedLessonId, state.selectedCourseId);
            }
        };

        window.goToNextPattern = () => {
            if (!state.selectedPattern || !state.selectedLessonId) return;
            state.currentExampleIndex = 0;
            const currentLessonPatterns = getPatternsForLesson(state.selectedLessonId);
            const currentIdx = currentLessonPatterns.findIndex(p => p.patternContent.id === state.selectedPattern.id);
            if (currentIdx !== -1 && currentIdx + 1 < currentLessonPatterns.length) {
                const nextPat = currentLessonPatterns[currentIdx + 1];
                selectPattern(nextPat.uuid, state.selectedLessonId, state.selectedCourseId);
            } else {
                backToLessonGrid();
            }
        };

        window.backToLessonGrid = () => {
            state.selectedPattern = null;
            renderSidebar();
            renderBreadcrumbs();
            renderWorkspace();
        };

        function renderStepHeaderHtml() {
            if (!state.selectedPattern) return '';
            const pId = state.selectedPattern.id;
            const isCompleted = !!userProgress[`${pId}-pattern-completed`];
            const maxUnlocked = getPatternMaxUnlockedStep(pId);
            const hideStep3 = !appSettings.showReviewStep3;
            const current = state.currentStep || 1;

            const step1Done = !!userProgress[`${pId}-step1-done`] || isCompleted;
            const step2Done = !!userProgress[`${pId}-step2-done`] || isCompleted;
            const step3Done = !!userProgress[`${pId}-step3-done`] || isCompleted;

            return `
                <div class="bg-white border border-[#E2E8F0] p-4 rounded-2xl shadow-xs mb-6 font-sans">
                    <div class="flex items-center justify-between gap-2 max-w-3xl mx-auto">
                        <!-- Step 1: Explanation -->
                        <button 
                            onclick="goToPatternStep(1)"
                            class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl transition text-xs md:text-sm cursor-pointer ${
                                current === 1 
                                    ? 'bg-[#2563EB] text-white font-bold shadow-md shadow-blue-500/20' 
                                    : step1Done 
                                        ? 'bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200 hover:bg-emerald-100' 
                                        : 'bg-slate-100 text-slate-700 font-medium'
                            }"
                        >
                            <i class="ph ${step1Done ? 'ph-check-circle text-emerald-600' : 'ph-book-open-text'} text-base"></i>
                            <span class="truncate">1. 句型讲解</span>
                        </button>

                        <i class="ph ph-caret-right text-slate-300 text-xs shrink-0"></i>

                        <!-- Step 2: Examples -->
                        <button 
                            onclick="goToPatternStep(2)"
                            ${maxUnlocked < 2 && !isCompleted ? 'disabled' : ''}
                            class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl transition text-xs md:text-sm ${
                                current === 2 
                                    ? 'bg-[#2563EB] text-white font-bold shadow-md shadow-blue-500/20 cursor-pointer' 
                                    : step2Done 
                                        ? 'bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200 hover:bg-emerald-100 cursor-pointer' 
                                        : maxUnlocked >= 2 
                                            ? 'bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 cursor-pointer' 
                                            : 'bg-slate-100 text-slate-400 font-medium cursor-not-allowed opacity-60'
                            }"
                        >
                            <i class="ph ${step2Done ? 'ph-check-circle text-emerald-600' : maxUnlocked < 2 ? 'ph-lock' : 'ph-chat-circle-dots'} text-base"></i>
                            <span class="truncate">2. 例句学习</span>
                        </button>

                        ${!hideStep3 ? `
                            <i class="ph ph-caret-right text-slate-300 text-xs shrink-0"></i>

                            <!-- Step 3: Practice -->
                            <button 
                                onclick="goToPatternStep(3)"
                                ${maxUnlocked < 3 && !isCompleted ? 'disabled' : ''}
                                class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl transition text-xs md:text-sm ${
                                    current === 3 
                                        ? 'bg-[#2563EB] text-white font-bold shadow-md shadow-blue-500/20 cursor-pointer' 
                                        : step3Done 
                                            ? 'bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200 hover:bg-emerald-100 cursor-pointer' 
                                            : maxUnlocked >= 3 
                                                ? 'bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 cursor-pointer' 
                                                : 'bg-slate-100 text-slate-400 font-medium cursor-not-allowed opacity-60'
                                }"
                            >
                                <i class="ph ${step3Done ? 'ph-check-circle text-emerald-600' : maxUnlocked < 3 ? 'ph-lock' : 'ph-pencil-line'} text-base"></i>
                                <span class="truncate">3. 交互练习</span>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // --- Load Specific Pattern via UUID ---
        async function loadPatternByUuid(uuid) {
            let pat = state.allPatterns.find(p => p.uuid === uuid);
            if (!pat) {
                try {
                    const res = await fetch(`/api/sentence_patterns/${uuid}`);
                    if (res.ok) {
                        pat = await res.json();
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            if (pat) {
                state.selectedPattern = pat.patternContent;
                state.currentExampleIndex = 0;
                const pId = pat.patternContent.id;
                const isCompleted = !!userProgress[`${pId}-pattern-completed`];
                const hideStep3 = !appSettings.showReviewStep3;
                if (isCompleted) {
                    state.currentStep = 1;
                } else {
                    const maxStep = getPatternMaxUnlockedStep(pId);
                    state.currentStep = hideStep3 ? Math.min(maxStep, 2) : maxStep;
                }
                if (pat.courses && pat.courses.length > 0) {
                    const mapping = pat.courses[0];
                    state.selectedCourseId = mapping.courseId;
                    state.selectedLessonId = mapping.lessonId;
                    state.expandedCourses[mapping.courseId] = true;
                }
                renderSidebar();
                renderWorkspace();
                renderBreadcrumbs();
            }
        }

        window.selectLesson = (lessonId, courseId) => {
            state.selectedLessonId = lessonId;
            if (courseId) {
                state.selectedCourseId = courseId;
                state.expandedCourses[courseId] = true;
            } else {
                const lesson = state.lessons.find(l => l.id === lessonId);
                if (lesson) {
                    state.selectedCourseId = lesson.course_id;
                    state.expandedCourses[lesson.course_id] = true;
                }
            }
            state.selectedPattern = null; // Show Lesson Pattern Cards Grid!
            
            renderSidebar();
            renderBreadcrumbs();
            renderWorkspace();
        };

        window.selectPattern = (uuid, lessonId, courseId) => {
            const pat = state.allPatterns.find(p => p.uuid === uuid);
            if (pat) {
                state.selectedPattern = pat.patternContent;
                state.currentExampleIndex = 0;
                if (lessonId) {
                    state.selectedLessonId = lessonId;
                }
                if (courseId) {
                    state.selectedCourseId = courseId;
                    state.expandedCourses[courseId] = true;
                }
                const pId = pat.patternContent.id;
                const isCompleted = !!userProgress[`${pId}-pattern-completed`];
                const hideStep3 = !appSettings.showReviewStep3;
                if (isCompleted) {
                    state.currentStep = 1;
                } else {
                    const maxStep = getPatternMaxUnlockedStep(pId);
                    state.currentStep = hideStep3 ? Math.min(maxStep, 2) : maxStep;
                }
                renderSidebar();
                renderWorkspace();
                renderBreadcrumbs();
            }
        };

        // --- Render Breadcrumbs Navigation Trail ---
        function renderBreadcrumbs() {
            const activeCourse = state.courses.find(c => c.id === state.selectedCourseId);
            const activeLesson = state.lessons.find(l => l.id === state.selectedLessonId);
            
            let html = `
                <span class="cursor-pointer hover:underline text-slate-500 hover:text-slate-800" onclick="resetToHome()">首页</span>
            `;
            if (activeCourse) {
                html += `
                    <i class="ph ph-caret-right text-[9px] text-[#94A3B8]"></i>
                    <span class="text-slate-600">${activeCourse.name}</span>
                `;
            }
            if (activeLesson) {
                html += `
                    <i class="ph ph-caret-right text-[9px] text-[#94A3B8]"></i>
                    <span class="cursor-pointer hover:underline ${!state.selectedPattern ? 'font-bold text-[#2563EB]' : 'text-slate-600 hover:text-[#2563EB]'}" onclick="backToLessonGrid()">${activeLesson.title}</span>
                `;
            }
            if (state.selectedPattern) {
                html += `
                    <i class="ph ph-caret-right text-[9px] text-[#94A3B8]"></i>
                    <span class="text-[#2563EB] font-bold">${state.selectedPattern.patternName}</span>
                `;
            }
            breadcrumbTrail.innerHTML = html;
        }

        window.resetToHome = () => {
            state.selectedCourseId = null;
            state.selectedLessonId = null;
            state.selectedPattern = null;
            renderSidebar();
            renderBreadcrumbs();
            renderWorkspace();
        };

        function renderHomeView() {
            return `
                <div class="text-center py-20 flex flex-col items-center card">
                    <div class="h-16 w-16 bg-blue-50 border border-blue-100 rounded-2xl flex items-center justify-center mb-4 text-[#2563EB] text-3xl shadow-inner">
                        🏫
                    </div>
                    <h2 class="text-xl font-bold text-slate-800">欢迎进入泰语句型教练</h2>
                    <p class="text-xs text-slate-500 mt-2 leading-relaxed max-w-md mx-auto">
                        请在左侧导航栏选择科目与课时。系统将在右侧以卡片形式展示该课时下的所有句型，点击卡片即可开启针对性句型学习与交互测评！
                    </p>
                </div>
            `;
        }

        function renderLessonGridView() {
            const activeCourse = state.courses.find(c => c.id === state.selectedCourseId);
            const activeLesson = state.lessons.find(l => l.id === state.selectedLessonId);
            if (!activeLesson) {
                return renderHomeView();
            }

            const lessonPatterns = getPatternsForLesson(activeLesson.id);
            const stats = getLessonStats(activeLesson.id);
            const nextUncompleted = lessonPatterns.find(p => !userProgress[`${p.patternContent.id}-pattern-completed`]) || lessonPatterns[0];

            const cardsHtml = lessonPatterns.length > 0 ? lessonPatterns.map((pat, idx) => {
                const p = pat.patternContent;
                const pId = p.id;
                const statusInfo = getPatternStatus(pId);
                const exCount = (p.examples || []).length;
                const practiceCount = getPatternExerciseCount(p);

                let statusBadge = '';
                let actionBtn = '';

                if (statusInfo.status === 'completed') {
                    statusBadge = `
                        <span class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-2xs">
                            <i class="ph-fill ph-check-circle text-emerald-600"></i>
                            <span>已完成</span>
                        </span>
                    `;
                    actionBtn = `
                        <button 
                            onclick="event.stopPropagation(); selectPattern('${pat.uuid}', '${activeLesson.id}', '${activeCourse ? activeCourse.id : ''}')"
                            class="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-100 hover:bg-[#2563EB] text-slate-700 hover:text-white border border-slate-200 hover:border-transparent transition flex items-center justify-center gap-1.5 shadow-2xs cursor-pointer"
                        >
                            <i class="ph ph-arrow-counter-clockwise text-sm"></i>
                            <span>复习句型</span>
                        </button>
                    `;
                } else if (statusInfo.status === 'in_progress') {
                    statusBadge = `
                        <span class="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 shadow-2xs">
                            <i class="ph-fill ph-clock text-amber-600"></i>
                            <span>学习中 · 第 ${statusInfo.step} 步</span>
                        </span>
                    `;
                    actionBtn = `
                        <button 
                            onclick="event.stopPropagation(); selectPattern('${pat.uuid}', '${activeLesson.id}', '${activeCourse ? activeCourse.id : ''}')"
                            class="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white transition flex items-center justify-center gap-1.5 shadow-md shadow-amber-500/20 active:scale-98 cursor-pointer"
                        >
                            <i class="ph-bold ph-play text-sm"></i>
                            <span>继续学习</span>
                        </button>
                    `;
                } else {
                    statusBadge = `
                        <span class="inline-flex items-center gap-1 text-[11px] font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200">
                            <i class="ph ph-circle text-slate-400"></i>
                            <span>未学习</span>
                        </span>
                    `;
                    actionBtn = `
                        <button 
                            onclick="event.stopPropagation(); selectPattern('${pat.uuid}', '${activeLesson.id}', '${activeCourse ? activeCourse.id : ''}')"
                            class="w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-[#2563EB] hover:bg-blue-700 text-white transition flex items-center justify-center gap-1.5 shadow-md shadow-blue-500/20 active:scale-98 cursor-pointer"
                        >
                            <i class="ph-bold ph-play text-sm"></i>
                            <span>开始学习</span>
                        </button>
                    `;
                }

                return `
                    <div 
                        onclick="selectPattern('${pat.uuid}', '${activeLesson.id}', '${activeCourse ? activeCourse.id : ''}')"
                        class="bg-white rounded-2xl p-5 border border-[#E2E8F0] shadow-xs hover:shadow-md hover:border-blue-400 hover:-translate-y-1 transition duration-200 flex flex-col justify-between cursor-pointer group font-sans relative"
