        // ==========================================
        // 关键词及生词标记高亮逻辑
        // ==========================================
        function highlightWordInElement(element, word, data) {
            const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            let node;
            const textNodes = [];
            while (node = walk.nextNode()) {
                let parent = node.parentElement;
                let isInsideChallenge = false;
                while (parent && parent !== element) {
                    if (parent.classList.contains('vocab-challenge') || parent.classList.contains('queried-vocab-challenge')) {
                        isInsideChallenge = true;
                        break;
                    }
                    parent = parent.parentElement;
                }
                if (!isInsideChallenge && node.nodeValue.includes(word)) {
                    textNodes.push(node);
                }
            }

            textNodes.forEach(textNode => {
                const parent = textNode.parentElement;
                const text = textNode.nodeValue;
                const parts = text.split(word);
                
                const fragment = document.createDocumentFragment();
                parts.forEach((part, i) => {
                    if (part) {
                        fragment.appendChild(document.createTextNode(part));
                    }
                    if (i < parts.length - 1) {
                        const span = document.createElement('span');
                        span.className = 'queried-vocab-challenge border-bottom-2-dashed-blue cursor-help transition-all duration-200';
                        span.style.borderBottom = '2px dashed #2563eb';
                        span.style.paddingBottom = '2px';
                        span.dataset.thai = word;
                        span.dataset.zh = data.zh || '';
                        span.dataset.ipa = data.ipa || '';
                        span.dataset.pos = data.pos || '';
                        span.dataset.en = data.en || '';
                        
                        span.addEventListener('mouseenter', () => {
                            span.style.backgroundColor = '#eff6ff';
                            span.style.color = '#1e40af';
                        });
                        span.addEventListener('mouseleave', () => {
                            span.style.backgroundColor = '';
                            span.style.color = '';
                        });

                        span.appendChild(document.createTextNode(word));
                        fragment.appendChild(span);
                    }
                });
                parent.replaceChild(fragment, textNode);
            });
        }

        function highlightWordInSentences(word, data) {
            const sentences = document.querySelectorAll('.thai-sentence, .thai-trans-sentence');
            sentences.forEach(sentence => {
                if (sentence.textContent.includes(word)) {
                    highlightWordInElement(sentence, word, data);
                }
            });
        }

        async function applyHistoryHighlights() {
            const history = await getQueryHistory();
            if (history && history.length > 0) {
                history.forEach(item => {
                    const firstExp = item.explanations && item.explanations.length > 0 ? item.explanations[0] : {};
                    const data = {
                        zh: item.explanations ? item.explanations.map(e => e.meanCh).join('; ') : '',
                        en: item.explanations ? item.explanations.map(e => e.meanEn).join('; ') : '',
                        pos: firstExp.pos || '词汇',
                        ipa: firstExp.ipa || ''
                    };
                    highlightWordInSentences(item.word, data);
                });
            }
        }

        // ==========================================
        // 1. 渲染阅读材料
        // ==========================================
        function renderReading() {
            if (!appData) return;
            const paraContainer = document.getElementById('paragraph-container');
            const transContainer = document.getElementById('translation-container');
            
            // 兼容处理：若为旧的扁平句子格式，在内存中临时包装为单段落结构
            if (!appData.paragraphs && appData.sentences) {
                appData.paragraphs = [{
                    paragraph_id: "p1",
                    sentences: appData.sentences
                }];
            }

            if (!appData.paragraphs) return;

            // 1. 渲染泰语段落（段落之间通过 <p class="mb-5 leading-loose"> 分隔，保持排版工整）
            paraContainer.innerHTML = appData.paragraphs.map(p => {
                const pid = p.paragraph_id || p.id || 'p1';
                return `
                    <p class="mb-5 leading-loose text-justify text-slate-800" data-pid="${pid}">
                        ${p.sentences.map(s => {
                            const sid = s.sentence_id || s.id;
                            return `<span class="thai-sentence hover:bg-yellow-50/50 rounded transition duration-150 cursor-pointer" data-pid="${pid}" data-sid="${sid}">${s.html_render}</span>`;
                        }).join(' ')}
                    </p>
                `;
            }).join('');

            // 2. 渲染中文翻译（顶部统计概览条、段落分块、句子卡片、重点/易错标记按钮及显著徽章）
            const summaryBarHtml = `
                <div class="tags-summary-header flex items-center justify-between pb-3 mb-4 border-b border-slate-200/80 text-xs text-slate-500">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-slate-700 flex items-center gap-1.5"><i class="fas fa-tags text-blue-500"></i> 句子标注状态：</span>
                        <span id="stat-important-count" class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 font-semibold inline-flex items-center gap-1 shadow-xs">
                            <i class="fas fa-star text-amber-500 text-[10px]"></i> 重点 0
                        </span>
                        <span id="stat-error-count" class="px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-800 font-semibold inline-flex items-center gap-1 shadow-xs">
                            <i class="fas fa-circle-exclamation text-rose-500 text-[10px]"></i> 易错 0
                        </span>
                    </div>
                    <div class="text-[11px] text-slate-400">
                        点击句子右侧“重点/易错”按钮即可标注或取消
                    </div>
                </div>
            `;

            const paragraphsHtml = appData.paragraphs.map(p => {
                const pid = p.paragraph_id || p.id || 'p1';
                const sentencesHtml = p.sentences.map(s => {
                    const sid = s.sentence_id || s.id;
                    const cleanThai = getCleanText(s.html_render);
                    const escapedThai = escapeHtml(cleanThai);
                    const sentenceIndex = sid.replace(/^[^\d]*/, '') || sid;
                    return `
                        <div class="trans-sentence-item relative p-3 rounded-xl border border-slate-200/80 bg-white hover:border-slate-300 transition-all duration-150" 
                             id="trans-item-${pid}-${sid}" 
                             data-paragraph-id="${pid}" 
                             data-sentence-id="${sid}">
                            <div class="flex items-center justify-between gap-2 mb-1.5 pb-1.5 border-b border-slate-100">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="font-bold text-xs text-slate-500 bg-slate-50 border border-slate-200/60 px-1.5 py-0.5 rounded min-w-[28px] text-center">[${sentenceIndex}]</span>
                                    <!-- 显著标记符号徽章区域 -->
                                    <div class="sentence-tags-badge-container flex items-center gap-1.5 hidden" id="tags-badge-${pid}-${sid}">
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 bg-slate-50 p-0.5 rounded-lg border border-slate-200/50">
                                    <button class="play-sentence-btn text-slate-400 hover:text-blue-600 transition active:scale-90 p-1 px-1.5 rounded flex items-center justify-center text-xs" data-text="${escapedThai}" title="播放发音">
                                        <i class="fas fa-volume-up"></i>
                                    </button>
                                    <button class="copy-sentence-btn text-slate-400 hover:text-blue-600 transition active:scale-90 p-1 px-1.5 rounded flex items-center justify-center text-xs" data-text="${escapedThai}" title="复制原文">
                                        <i class="fas fa-copy"></i>
                                    </button>
                                    <span class="w-[1px] h-3 bg-slate-200 mx-0.5"></span>
                                    <!-- 重点标签按钮：点击一次打标签，已标签再次点击则取消 -->
                                    <button class="tag-sentence-btn tag-btn-important text-slate-400 hover:text-amber-600 hover:bg-amber-50 p-1 px-2 rounded-md transition duration-150 text-xs flex items-center gap-1 active:scale-95 border border-transparent" 
                                            data-tag="important" 
                                            data-pid="${pid}" 
                                            data-sid="${sid}" 
                                            title="标记为重点 (点击切换)">
                                        <i class="far fa-star text-xs"></i>
                                        <span class="text-xs font-medium">重点</span>
                                    </button>
                                    <!-- 易错标签按钮：点击一次打标签，已标签再次点击则取消 -->
                                    <button class="tag-sentence-btn tag-btn-error text-slate-400 hover:text-rose-600 hover:bg-rose-50 p-1 px-2 rounded-md transition duration-150 text-xs flex items-center gap-1 active:scale-95 border border-transparent" 
                                            data-tag="error" 
                                            data-pid="${pid}" 
                                            data-sid="${sid}" 
                                            title="标记为易错 (点击切换)">
                                        <i class="far fa-circle-exclamation text-xs"></i>
                                        <span class="text-xs font-medium">易错</span>
                                    </button>
                                </div>
                            </div>
                            <div class="font-thai text-base text-slate-800 mb-1 leading-relaxed">
                                <span class="thai-trans-sentence">${cleanThai}</span>
                            </div>
                            <div class="text-slate-600 leading-relaxed text-sm bg-slate-50/50 p-2 rounded-lg border border-slate-100/60">
                                ${s.translation_zh}
                            </div>
                        </div>
                    `;
                }).join('');
                return `
                    <div class="pb-6 mb-6 last:mb-0 last:pb-0 border-b-2 border-black last:border-b-0 space-y-3">
                        ${sentencesHtml}
                    </div>
                `;
            }).join('');

            transContainer.innerHTML = summaryBarHtml + paragraphsHtml;

            // 自动高亮历史查询单词
            applyHistoryHighlights();

            // 如果当前已有激活文章，加载并应用该文章在 IndexedDB 中的标签
            if (window.activeArticleUuid) {
                loadAndApplySentenceTags(window.activeArticleUuid);
            }

            // 保持/应用当前选择的文章显示模式 (原文视图 vs 句子中文翻译视图)
            switchArticleView(currentArticleView);
        }

        // ==========================================
        // 1.1 文章视图模式切换 (原文视图 vs 句子中文翻译视图)
        // ==========================================
        let currentArticleView = 'raw'; // 'raw' | 'trans'

        function switchArticleView(mode) {
            currentArticleView = (mode === 'trans') ? 'trans' : 'raw';
            const paraContainer = document.getElementById('paragraph-container');
            const transContainer = document.getElementById('translation-container');
            const tabRaw = document.getElementById('tab-article-raw');
            const tabTrans = document.getElementById('tab-article-trans');
            const transToggle = document.getElementById('transToggle');

            if (currentArticleView === 'trans') {
                if (paraContainer) paraContainer.classList.add('hidden');
                if (transContainer) transContainer.classList.remove('hidden');

                if (tabRaw) tabRaw.classList.remove('active');
                if (tabTrans) tabTrans.classList.add('active');

                if (transToggle && !transToggle.checked) {
                    transToggle.checked = true;
                }
            } else {
                if (transContainer) transContainer.classList.add('hidden');
                if (paraContainer) paraContainer.classList.remove('hidden');

                if (tabTrans) tabTrans.classList.remove('active');
                if (tabRaw) tabRaw.classList.add('active');

                if (transToggle && transToggle.checked) {
                    transToggle.checked = false;
                }
            }
        }
        window.switchArticleView = switchArticleView;

        // ==========================================
        // 2. 渲染测试题目
        // ==========================================
        function renderQuiz() {
            if (!appData) return;
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            const types = ['topic', 'main_idea', 'supporting_details'];

            types.forEach(type => {
                const q = appData.comprehension_quiz[type];
                const isMultiple = q.type === 'multiple';
                const inputType = isMultiple ? 'checkbox' : 'radio';
                const icon = type === 'topic' ? 'bullseye' : (type === 'main_idea' ? 'lightbulb' : 'list-ul');
                const color = type === 'topic' ? 'text-purple-600 bg-purple-50' : (type === 'main_idea' ? 'text-blue-600 bg-blue-50' : 'text-teal-600 bg-teal-50');

                const card = document.createElement('div');
                card.className = 'p-6 bg-slate-50 rounded-xl border border-slate-200';
                card.innerHTML = `
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center text-lg">
                        <span class="w-8 h-8 rounded-full ${color} flex items-center justify-center mr-3">
                            <i class="fas fa-${icon} text-sm"></i>
                        </span>
                        ${q.question_zh}
                        ${isMultiple ? '<span class="ml-2 text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full">多选</span>' : ''}
                    </h3>
                    <div class="space-y-3" id="opts-${type}">
                        ${q.options.map(opt => `
                            <label class="quiz-option flex items-center p-4 rounded-lg" data-opt-id="${opt.id}">
                                <input type="${inputType}" name="quiz-${type}" value="${opt.id}" class="w-5 h-5 text-thaiBlue focus:ring-thaiBlue mr-4 flex-shrink-0">
                                <span class="thai-text text-gray-700 text-base leading-relaxed">${opt.text}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);

                // 绑定选中样式
                card.querySelectorAll('input').forEach(input => {
                    input.addEventListener('change', () => {
                        if (isSubmitted) return;
                        if (!isMultiple) {
                            card.querySelectorAll('.quiz-option').forEach(l => l.classList.remove('selected'));
                        }
                        const label = input.closest('.quiz-option');
                        if (input.checked) {
                            label.classList.add('selected');
                        } else {
                            label.classList.remove('selected');
                        }
                    });
                });
            });
        }

        // ==========================================
        // 2.5 词汇配对练习逻辑
        // ==========================================
        let matchSelectedThaiId = null;
        let matchSelectedThaiCard = null;
        let matchMatchedSet = new Set();
        let matchTotalCount = 0;

        function renderVocabPractice() {
            const section = document.getElementById('vocab-practice-section');
            const thaiCol = document.getElementById('match-thai-column');
            const chineseCol = document.getElementById('match-chinese-column');
            
            // 重置状态
            matchSelectedThaiId = null;
            matchSelectedThaiCard = null;
            matchMatchedSet.clear();
            
            if (!appData || !appData.vocabulary_glossary || Object.keys(appData.vocabulary_glossary).length === 0) {
                section.classList.add('hidden');
                return;
            }
            
            section.classList.remove('hidden');
            
            // 提取词汇
            const vocabList = [];
            Object.keys(appData.vocabulary_glossary).forEach(key => {
                const item = appData.vocabulary_glossary[key];
                vocabList.push({
                    id: key,
                    thai: item.thai || key,
                    zh: item.zh || '',
                    ipa: item.ipa || '',
                    pos: item.pos || ''
                });
            });

            matchTotalCount = vocabList.length;
            updateMatchProgress();

            // 随机打乱
            const shuffledThai = [...vocabList].sort(() => Math.random() - 0.5);
            const shuffledChinese = [...vocabList].sort(() => Math.random() - 0.5);

            // 渲染泰语单词卡片
            thaiCol.innerHTML = '';
            shuffledThai.forEach(item => {
                const card = document.createElement('div');
                card.className = "thai-drag-card bg-white border border-slate-200 hover:border-violet-400 rounded-xl px-4 py-2 text-center cursor-grab active:cursor-grabbing font-thai text-lg font-bold transition shadow-sm select-none hover:shadow-md";
                card.id = `match-thai-card-${item.id}`;
                card.dataset.id = item.id;
                card.draggable = true;
                card.textContent = item.thai;

                // 拖拽事件
                card.ondragstart = (e) => {
                    e.dataTransfer.setData('text/plain', item.id);
                    card.classList.add('opacity-50');
                };
                card.ondragend = () => {
                    card.classList.remove('opacity-50');
                };

                // 点击事件（用于依次点击配对）
                card.onclick = () => {
                    selectMatchThaiCard(card, item.id);
                };

                thaiCol.appendChild(card);
            });

            // 渲染中文释义插槽
            chineseCol.innerHTML = '';
            shuffledChinese.forEach(item => {
                const slot = document.createElement('div');
                slot.className = "chinese-drop-slot bg-white border border-slate-200 rounded-xl p-3 flex flex-col gap-2 transition min-h-[76px] justify-center items-center hover:shadow-sm cursor-pointer";
                slot.id = `match-chinese-slot-${item.id}`;
                slot.dataset.id = item.id;

                slot.innerHTML = `
                    <div class="text-sm font-semibold text-slate-700 font-sans text-center">${item.zh}</div>
                    <div class="drop-zone border border-dashed border-slate-200 bg-slate-50/50 rounded-lg p-2 min-h-[40px] flex items-center justify-center text-[10px] text-slate-400 font-sans mt-1 w-full">
                        拖拽或点击配对
                    </div>
                `;

                // 拖拽悬停视觉效果
                slot.ondragover = (e) => {
                    e.preventDefault();
                    if (!matchMatchedSet.has(item.id)) {
                        slot.classList.add('border-violet-400', 'bg-violet-50/30');
                    }
                };
                slot.ondragleave = () => {
                    slot.classList.remove('border-violet-400', 'bg-violet-50/30');
                };

                // 放下事件
                slot.ondrop = (e) => {
                    e.preventDefault();
                    slot.classList.remove('border-violet-400', 'bg-violet-50/30');
                    const draggedId = e.dataTransfer.getData('text/plain');
                    handleMatchAttempt(draggedId, item.id, slot);
                };

                // 点击事件
                slot.onclick = () => {
                    if (matchSelectedThaiId) {
                        handleMatchAttempt(matchSelectedThaiId, item.id, slot);
                    }
                };

                chineseCol.appendChild(slot);
            });
        }

        function selectMatchThaiCard(card, id) {
            if (matchMatchedSet.has(id)) return;

            document.querySelectorAll('.thai-drag-card').forEach(c => {
                c.classList.remove('match-card-selected');
            });

            if (matchSelectedThaiId === id) {
                matchSelectedThaiId = null;
                matchSelectedThaiCard = null;
            } else {
                card.classList.add('match-card-selected');
                matchSelectedThaiId = id;
                matchSelectedThaiCard = card;
            }
        }

        function handleMatchAttempt(thaiId, slotId, slot) {
            if (matchMatchedSet.has(slotId)) return;

            if (thaiId === slotId) {
                // 配对正确
                matchMatchedSet.add(thaiId);

                // 隐藏泰语卡片
                const thaiCard = document.getElementById(`match-thai-card-${thaiId}`);
                if (thaiCard) {
                    thaiCard.classList.add('hidden');
                }

                // 更新中文卡片插槽
                const dropzone = slot.querySelector('.drop-zone');
                if (dropzone) {
                    dropzone.innerHTML = `
                        <div class="flex items-center justify-center gap-1.5 text-emerald-700 font-bold font-thai text-base">
                            <i class="fas fa-check-circle text-emerald-500 text-sm"></i>
                            <span>${appData.vocabulary_glossary[thaiId].thai}</span>
                        </div>
                    `;
                    dropzone.className = "w-full border border-emerald-500 bg-emerald-50/30 rounded-lg p-2 min-h-[40px] flex items-center justify-center mt-1";
                }

                slot.className = "chinese-drop-slot bg-emerald-50/10 border border-emerald-300 rounded-xl p-3 flex flex-col gap-2 transition min-h-[76px] justify-center items-center";
                
                // 清除当前选择
                if (matchSelectedThaiId === thaiId) {
                    matchSelectedThaiId = null;
                    matchSelectedThaiCard = null;
                }

                // 播放发音
                const thaiWord = appData.vocabulary_glossary[thaiId].thai;
                if (window.playAudioDirect) {
                    window.playAudioDirect(thaiWord.replace(/\s+/g, ''));
                }

                updateMatchProgress();
            } else {
                // 配对错误：抖动动效
                slot.classList.add('shake-wrong');
                setTimeout(() => {
                    slot.classList.remove('shake-wrong');
                }, 400);

                // 清除选中效果以便重新尝试
                if (matchSelectedThaiCard) {
                    matchSelectedThaiCard.classList.remove('match-card-selected');
                }
                matchSelectedThaiId = null;
                matchSelectedThaiCard = null;
            }
        }

        function updateMatchProgress() {
            const count = matchMatchedSet.size;
            document.getElementById('match-progress-text').textContent = `已配对 ${count} / ${matchTotalCount}`;
            
            const pct = matchTotalCount > 0 ? (count / matchTotalCount) * 100 : 0;
            document.getElementById('match-progress-bar').style.width = `${pct}%`;
        }

        // ==========================================
        // 3. 全局交互：Hover 词典 (Tooltip)
        // ==========================================
        document.addEventListener('mouseover', (e) => {
            const target = e.target.closest('.vocab-challenge, .queried-vocab-challenge');
            if (target && !isSubmitted) { // 提交后禁用查词，强迫复习
                clearTimeout(tooltipTimeout);
                let data = null;
                if (target.classList.contains('vocab-challenge')) {
                    data = appData ? appData.vocabulary_glossary[target.dataset.vocab] : null;
                } else if (target.classList.contains('queried-vocab-challenge')) {
                    data = {
                        thai: target.dataset.thai,
                        ipa: target.dataset.ipa,
                        pos: target.dataset.pos,
                        zh: target.dataset.zh,
                        en: target.dataset.en
                    };
                }

                if (data) {
                    document.getElementById('tt-thai').textContent = data.thai || '';
                    document.getElementById('tt-ipa').textContent = data.ipa || '';
                    document.getElementById('tt-pos').textContent = data.pos || '';
                    document.getElementById('tt-zh').textContent = data.zh || '';
                    document.getElementById('tt-en').textContent = data.en || '';
                    
                    const rect = target.getBoundingClientRect();
                    let top = rect.bottom + window.scrollY + 10;
                    let left = rect.left + window.scrollX;
                    
                    // 边界检测：防止右侧溢出
                    if (left + 280 > window.innerWidth) {
                        left = window.innerWidth - 300;
                    }
                    // 边界检测：防止底部溢出
                    if (top + 150 > window.innerHeight + window.scrollY) {
                        top = rect.top + window.scrollY - 160;
                    }
 
                    tooltip.style.top = `${top}px`;
                    tooltip.style.left = `${left}px`;
                    tooltip.classList.add('show');
                }
            }
        });
 
        document.addEventListener('mouseout', (e) => {
            if (e.target.closest('.vocab-challenge, .queried-vocab-challenge')) {
                tooltipTimeout = setTimeout(() => tooltip.classList.remove('show'), 200);
            }
        });

        // ==========================================
        // 4. 工具栏开关逻辑
        // ==========================================
        document.getElementById('radarToggle').addEventListener('change', (e) => {
            document.body.classList.toggle('radar-on', e.target.checked);
        });
        document.body.classList.add('radar-on'); // 默认开启

        document.getElementById('transToggle').addEventListener('change', (e) => {
            switchArticleView(e.target.checked ? 'trans' : 'raw');
        });

        // ==========================================
        // 5. 提交与反馈逻辑
        // ==========================================
        document.getElementById('submitBtn').addEventListener('click', () => {
            if (!appData || isSubmitted) return;
            isSubmitted = true;
            
            let totalScore = 0;
            const totalQuestions = 3;
            const feedbackSection = document.getElementById('feedback-section');
            const feedbackContent = document.getElementById('feedback-content');
            let detailHtml = '';

            const types = ['topic', 'main_idea', 'supporting_details'];
            
            types.forEach(type => {
                const q = appData.comprehension_quiz[type];
                const isMultiple = q.type === 'multiple';
                const inputs = document.querySelectorAll(`#opts-${type} input`);
                const correctIds = q.options.filter(o => o.is_correct).map(o => o.id);
                
                let userSelected = Array.from(inputs).filter(i => i.checked).map(i => i.value);
                let isQuestionCorrect = false;

                // 视觉反馈渲染
                inputs.forEach(input => {
                    const label = input.closest('.quiz-option');
                    label.classList.remove('selected');
                    
                    if (input.checked && correctIds.includes(input.value)) {
                        label.classList.add('correct');
                        label.insertAdjacentHTML('beforeend', '<i class="fas fa-check-circle text-green-500 ml-auto text-xl"></i>');
                    } else if (input.checked && !correctIds.includes(input.value)) {
                        label.classList.add('incorrect');
                        label.insertAdjacentHTML('beforeend', '<i class="fas fa-times-circle text-red-500 ml-auto text-xl"></i>');
                    } else if (!input.checked && correctIds.includes(input.value)) {
                        label.classList.add('missed');
                        label.insertAdjacentHTML('beforeend', '<i class="fas fa-exclamation-circle text-yellow-500 ml-auto text-xl"></i>');
                    }
                    input.disabled = true;
                });

                // 计算该题得分
                if (isMultiple) {
                    isQuestionCorrect = (userSelected.length === correctIds.length && userSelected.every(id => correctIds.includes(id)));
                } else {
                    isQuestionCorrect = (userSelected.length === 1 && correctIds.includes(userSelected[0]));
                }

                if (isQuestionCorrect) totalScore++;
                
                // 生成解析文本
                const statusIcon = isQuestionCorrect ? '<i class="fas fa-check-circle text-green-500 mr-2"></i>' : '<i class="fas fa-times-circle text-red-500 mr-2"></i>';
                const statusText = isQuestionCorrect ? '回答正确' : '回答错误';
                detailHtml += `
                    <div class="flex items-center p-3 bg-slate-50 rounded-lg mb-2">
                        ${statusIcon}
                        <span class="font-medium ${isQuestionCorrect ? 'text-green-700' : 'text-red-700'}">${q.question_zh.split('.')[0]}：${statusText}</span>
                    </div>
                `;
            });

            // 渲染最终反馈面板
            feedbackSection.classList.remove('hidden');
            const scoreColor = totalScore === totalQuestions ? 'text-green-600' : (totalScore > 0 ? 'text-yellow-600' : 'text-red-600');
            
            feedbackContent.innerHTML = `
                <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center">
                    <i class="fas fa-chart-pie text-thaiGreen mr-3"></i> 测试报告
                </h2>
                <div class="flex items-center justify-between bg-slate-50 p-6 rounded-xl mb-6 border border-slate-200">
                    <div>
                        <p class="text-gray-500 text-sm mb-1">最终得分</p>
                        <p class="text-5xl font-black ${scoreColor}">${totalScore} <span class="text-2xl text-gray-400 font-normal">/ ${totalQuestions}</span></p>
                    </div>
                    <div class="text-right text-sm text-gray-600 max-w-xs">
                        ${totalScore === totalQuestions ? '🎉 完美！你精准掌握了语篇的核心逻辑与细节。' : '💡 提示：请查看下方标红的选项（选错）和标黄的选项（漏选），结合原文信号词重新思考。'}
                    </div>
                </div>
                <h3 class="font-bold text-gray-700 mb-3">详细解析：</h3>
                ${detailHtml}
                <div class="mt-6 pt-4 border-t text-sm text-gray-500">
                    <i class="fas fa-info-circle mr-1"></i> 提示：提交后已禁用生词 Hover 查词功能。请尝试通过上下文和信号词（雷达高亮）来复习错题。
                </div>
            `;

            // 禁用提交按钮
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-check mr-2"></i> 已提交';

            // 滚动到反馈区
            feedbackSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // ==========================================
        // 6. 重置逻辑
        // ==========================================
        document.getElementById('resetBtn').addEventListener('click', () => {
            isSubmitted = false;
            document.getElementById('feedback-section').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-paper-plane mr-2"></i> 提交并查看解析';
            renderQuiz(); // 重新渲染题目以清除状态
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 词汇练习重置
        const resetMatchBtn = document.getElementById('resetMatchBtn');
        if (resetMatchBtn) {
            resetMatchBtn.addEventListener('click', () => {
                renderVocabPractice();
            });
        }

        // ==========================================
        // 7. 文章加载与 API 集成 (支持 URL 参数与深度链接)
        // ==========================================
        window.activeArticleUuid = null;
        window.firstAvailableUuid = null;

        // 从当前页面 URL 中解析文章 ID (支持 ?id=..., ?uuid=..., ?articleId=..., ?article_id=... 及 Hash 参数)
        function getArticleIdFromUrl() {
            try {
                // 1. 优先从 window.location.search 获取
                const urlParams = new URLSearchParams(window.location.search);
                let id = urlParams.get('id') || urlParams.get('uuid') || urlParams.get('articleId') || urlParams.get('article_id');
                if (id) return id.trim();

                // 2. 备用从 window.location.hash 中提取参数 (如 #?id=... 或 #id=...)
                if (window.location.hash) {
                    const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
                    const qIndex = hash.indexOf('?');
                    const hashQuery = qIndex !== -1 ? hash.substring(qIndex + 1) : (hash.includes('=') ? hash : '');
                    if (hashQuery) {
                        const hashParams = new URLSearchParams(hashQuery);
                        id = hashParams.get('id') || hashParams.get('uuid') || hashParams.get('articleId') || hashParams.get('article_id');
                        if (id) return id.trim();
                    }
                }
            } catch (e) {
                console.warn("解析 URL 参数失败:", e);
            }
            return '';
        }

        // 同步浏览器地址栏 URL 参数 (保持 ?id=... 与当前阅读文章一致，便于收藏与分享)
        function syncUrlArticleId(uuid, pushHistory = false) {
            if (!uuid) return;
            try {
                const url = new URL(window.location.href);
                const currentId = url.searchParams.get('id');
                // 如果当前 URL 中已经是标准 ?id=uuid 且没有冗余别名参数，则无需重复更新
                if (currentId === uuid && !url.searchParams.has('uuid') && !url.searchParams.has('articleId') && !url.searchParams.has('article_id')) {
                    return;
                }
                url.searchParams.set('id', uuid);
                url.searchParams.delete('uuid');
                url.searchParams.delete('articleId');
                url.searchParams.delete('article_id');

                if (pushHistory) {
                    window.history.pushState({ articleId: uuid }, '', url.toString());
                } else {
                    window.history.replaceState({ articleId: uuid }, '', url.toString());
                }
            } catch (e) {
                console.warn('同步 URL 参数失败:', e);
            }
        }

        function highlightAndExpandActive(uuid) {
            if (!uuid) return;
            window.activeArticleUuid = uuid;
            
            let matchedEl = null;
            document.querySelectorAll('.article-item').forEach(el => {
                if (el.dataset.uuid === uuid) {
                    matchedEl = el;
                    el.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-700');
                    el.classList.remove('border-transparent', 'text-gray-600');
                    
                    // Traverse up parents to remove 'hidden' class from accordions
                    let parent = el.parentElement;
                    while (parent && parent.id !== 'articleList') {
                        if (parent.classList.contains('subject-lessons') || parent.classList.contains('lesson-readings')) {
                            if (parent.classList.contains('hidden')) {
                                parent.classList.remove('hidden');
                                // rotate corresponding icon
                                const icon = document.getElementById('icon-' + parent.id);
                                if (icon) icon.classList.add('rotate-180');
                            }
                        }
                        parent = parent.parentElement;
                    }
                } else {
                    el.classList.remove('bg-blue-50', 'border-blue-200', 'text-blue-700');
                    el.classList.add('border-transparent', 'text-gray-600');
                }
            });

            if (matchedEl) {
                matchedEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        window.toggleAccordion = function(id) {
            const el = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (!el) return;
            
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                if (icon) icon.classList.add('rotate-180');
            } else {
                el.classList.add('hidden');
                if (icon) icon.classList.remove('rotate-180');
            }
        }

        window.loadArticle = async function(uuid, updateHistory = true, pushHistory = false) {
            if (!uuid) return;
            try {
                window.activeArticleUuid = uuid;
                if (updateHistory) {
                    syncUrlArticleId(uuid, pushHistory);
                }

                document.getElementById('paragraph-container').innerHTML = '<div class="text-center py-8 text-slate-400 italic"><i class="fas fa-spinner fa-spin mr-2"></i>正在加载文章内容...</div>';
                const transContainer = document.getElementById('translation-container');
                if (transContainer) {
                    transContainer.innerHTML = '<div class="text-center py-8 text-slate-400 italic"><i class="fas fa-spinner fa-spin mr-2"></i>正在加载文章内容...</div>';
                }
                
                const res = await fetch(`/api/readings/${encodeURIComponent(uuid)}`);
                if (!res.ok) {
                    if (res.status === 404) {
                        throw new Error(`未找到指定的阅读文章 (ID: ${uuid})`);
                    }
                    throw new Error(`加载文章失败 (HTTP ${res.status})`);
                }
                const data = await res.json();
                
                // Highlight active selection UI and expand parent folders
                highlightAndExpandActive(uuid);

                // Update page metadata and title
                document.getElementById('article-title-heading').innerHTML = `
                    <i class="fas fa-landmark text-gray-400 mr-2"></i> 阅读材料：${escapeHtml(data.title)}
                `;
                document.getElementById('article-meta-badge').textContent = `
                    科目：${data.subject || '未分类'} | 难度：${data.difficulty} | 单词数：${data.word_count}
                `;
                if (data.title) {
                    document.title = `${data.title} - 泰语语篇阅读训练`;
                }

                // Set appData and reset state
                window.currentArticle = data;
                appData = data.content;
                isSubmitted = false;
                
                // Reset quiz submit button
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> 提交并查看解析';

                // Hide feedback
                document.getElementById('feedback-section').classList.add('hidden');

                // Render article, quiz and vocab practice
                renderReading();
                renderQuiz();
                renderVocabPractice();

                // 加载并显示本文章的历史句子标签
                await loadAndApplySentenceTags(uuid);
            } catch (err) {
                console.error("加载文章失败:", err);
                switchArticleView('raw');
                const defaultBtnHtml = window.firstAvailableUuid && window.firstAvailableUuid !== uuid
                    ? `<button onclick="loadArticle('${window.firstAvailableUuid}', true, true)" class="mt-4 px-4 py-2 bg-thaiBlue hover:bg-blue-700 text-white text-xs font-bold rounded-xl transition shadow-sm active:scale-95 inline-flex items-center gap-1.5"><i class="fas fa-book-open"></i>阅读首篇可用文章</button>`
                    : '';
                document.getElementById('paragraph-container').innerHTML = `
                    <div class="text-center py-10 px-4 space-y-3">
                        <div class="inline-flex p-3 rounded-full bg-red-50 text-red-500 mb-1">
                            <i class="fas fa-exclamation-circle text-2xl"></i>
                        </div>
                        <div class="text-base text-red-600 font-semibold">${escapeHtml(err.message)}</div>
                        <p class="text-xs text-slate-400 max-w-md mx-auto">请确认 URL 中的文章 ID 参数是否正确，或在左侧文章清单中选择其他文章进行阅读。</p>
                        ${defaultBtnHtml}
                    </div>
                `;
            }
        }

        async function loadArticleList(search = '') {
            const listEl = document.getElementById('articleList');
            listEl.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs italic">加载中...</div>';
            
            try {
                const [resCourses, resLessons, resReadings] = await Promise.all([
                    fetch('/api/courses'),
                    fetch('/api/lessons'),
                    fetch('/api/readings')
                ]);
                
                if (!resCourses.ok || !resLessons.ok || !resReadings.ok) {
                    throw new Error("从服务器加载数据失败");
                }
                
                const courses = await resCourses.json();
                const lessons = await resLessons.json();
                const readings = await resReadings.json();
                
                const query = search.trim().toLowerCase();
                const filteredReadings = readings.filter(art => {
                    const titleMatch = art.title.toLowerCase().includes(query);
                    const subjectMatch = (art.subject || '').toLowerCase().includes(query);
                    return !query || titleMatch || subjectMatch;
                });
                
                if (filteredReadings.length === 0) {
                    listEl.innerHTML = '<div class="text-center py-6 text-slate-400 text-xs italic">无符合条件的文章</div>';
                    return;
                }
                
                const coursesMap = {};
                courses.forEach(c => {
                    coursesMap[c.id] = {
                        id: c.id,
                        name: c.name,
                        lessons: {}
                    };
                });
                
                lessons.forEach(l => {
                    if (coursesMap[l.course_id]) {
                        coursesMap[l.course_id].lessons[l.id] = {
                            id: l.id,
                            title: l.title,
                            readings: []
                        };
                    }
                });
                
                const uncategorizedReadings = [];
                
                filteredReadings.forEach(art => {
                    if (art.courses && art.courses.length > 0) {
                        art.courses.forEach(assoc => {
                            if (coursesMap[assoc.courseId] && coursesMap[assoc.courseId].lessons[assoc.lessonId]) {
                                coursesMap[assoc.courseId].lessons[assoc.lessonId].readings.push(art);
                            } else {
                                if (!uncategorizedReadings.some(u => u.uuid === art.uuid)) {
                                    uncategorizedReadings.push(art);
                                }
                            }
                        });
                    } else {
                        uncategorizedReadings.push(art);
                    }
                });
                
                let html = '<div class="space-y-2">';
                
                courses.forEach(c => {
                    const courseObj = coursesMap[c.id];
                    let hasReadings = false;
                    const courseLessonsHtml = Object.values(courseObj.lessons).map(l => {
                        if (l.readings.length > 0) {
                            hasReadings = true;
                            
                            const readingsHtml = l.readings.map(art => `
                                <button class="article-item w-full text-left p-2 rounded-lg border text-xs transition duration-150 flex flex-col gap-1 border-transparent text-gray-600 hover:bg-slate-50 hover:border-gray-250" 
                                    data-uuid="${art.uuid}" 
                                    onclick="loadArticle('${art.uuid}', true, true)">
                                    <span class="font-bold text-gray-800 text-xs truncate w-full">${art.title}</span>
                                    <div class="flex justify-between text-[10px] text-gray-400">
                                        <span>难度: ${art.difficulty}</span>
                                        <span>单词: ${art.word_count}</span>
                                    </div>
                                </button>
                            `).join('');
                            
                            const isHidden = query ? '' : 'hidden';
                            const iconClass = query ? 'rotate-180' : '';
                            return `
                                <div class="lesson-group">
                                    <button class="lesson-header w-full flex items-center justify-between py-1.5 pr-2 text-xs font-semibold text-gray-600 hover:text-blue-600 transition" onclick="toggleAccordion('lesson-${l.id}')">
                                        <div class="flex items-center gap-1.5 truncate">
                                            <i class="fas fa-bookmark text-amber-500 text-[10px]"></i>
                                            <span class="truncate">${l.title}</span>
                                        </div>
                                        <i class="fas fa-chevron-down text-gray-400 text-[10px] transition-transform duration-200 ${iconClass}" id="icon-lesson-${l.id}"></i>
                                    </button>
                                    <div class="lesson-readings ${isHidden} pl-3 pr-1 py-1 space-y-1" id="lesson-${l.id}">
                                        ${readingsHtml}
                                    </div>
                                </div>
                            `;
                        }
                        return '';
                    }).join('');
                    
                    if (hasReadings) {
                        const isHidden = query ? '' : 'hidden';
                        const iconClass = query ? 'rotate-180' : '';
                        html += `
                            <div class="subject-group border border-gray-100 rounded-xl overflow-hidden bg-slate-50/50">
                                <button class="subject-header w-full flex items-center justify-between p-2.5 text-xs font-bold text-gray-700 bg-slate-100 hover:bg-slate-200/80 transition duration-150" onclick="toggleAccordion('subject-${c.id}')">
                                    <div class="flex items-center gap-2 truncate">
                                        <i class="fas fa-folder text-blue-500"></i>
                                        <span class="truncate">${c.name}</span>
                                    </div>
                                    <i class="fas fa-chevron-down text-gray-400 transition-transform duration-200 ${iconClass}" id="icon-subject-${c.id}"></i>
                                </button>
                                <div class="subject-lessons ${isHidden} pl-2.5 py-1.5 space-y-1.5" id="subject-${c.id}">
                                    ${courseLessonsHtml}
                                </div>
                            </div>
                        `;
                    }
                });
                
                if (uncategorizedReadings.length > 0) {
                    const readingsHtml = uncategorizedReadings.map(art => `
                        <button class="article-item w-full text-left p-2 rounded-lg border text-xs transition duration-150 flex flex-col gap-1 border-transparent text-gray-600 hover:bg-slate-50 hover:border-gray-250" 
                            data-uuid="${art.uuid}" 
                            onclick="loadArticle('${art.uuid}', true, true)">
                            <span class="font-bold text-gray-800 text-xs truncate w-full">${art.title}</span>
                            <div class="flex justify-between text-[10px] text-gray-400">
                                <span>难度: ${art.difficulty}</span>
                                <span>单词: ${art.word_count}</span>
                            </div>
                        </button>
                    `).join('');
                    
                    const isHidden = query ? '' : 'hidden';
                    const iconClass = query ? 'rotate-180' : '';
                    html += `
                        <div class="subject-group border border-gray-100 rounded-xl overflow-hidden bg-slate-50/50">
                            <button class="subject-header w-full flex items-center justify-between p-2.5 text-xs font-bold text-gray-700 bg-slate-100 hover:bg-slate-200/80 transition duration-150" onclick="toggleAccordion('subject-uncategorized')">
                                <div class="flex items-center gap-2 truncate">
                                    <i class="fas fa-folder-open text-gray-500"></i>
                                    <span class="truncate">未分类文章</span>
                                </div>
                                <i class="fas fa-chevron-down text-gray-400 transition-transform duration-200 ${iconClass}" id="icon-subject-uncategorized"></i>
                            </button>
                            <div class="subject-lessons ${isHidden} pl-2.5 py-1.5 space-y-1" id="subject-uncategorized">
                                ${readingsHtml}
                            </div>
                        </div>
                    `;
                }
                
                html += '</div>';
                listEl.innerHTML = html;
                
                if (readings.length > 0) {
                    window.firstAvailableUuid = readings[0].uuid;
                }

                if (window.activeArticleUuid) {
                    highlightAndExpandActive(window.activeArticleUuid);
                } else {
                    const queryUuid = getArticleIdFromUrl();
                    if (queryUuid) {
                        loadArticle(queryUuid, false, false);
                    } else if (readings.length > 0) {
                        loadArticle(readings[0].uuid, true, false);
                    }
                }
            } catch (err) {
                console.error(err);
                listEl.innerHTML = `<div class="text-center py-6 text-red-500 text-xs italic">加载失败: ${err.message}</div>`;
            }
        }

        // 监听浏览器前进/后退导航，与 URL 中的文章 ID 保持同步
        window.addEventListener('popstate', () => {
            const urlId = getArticleIdFromUrl();
            if (urlId && urlId !== window.activeArticleUuid) {
                loadArticle(urlId, false, false);
            }
        });

        // Toggle Sidebar smoothly
        document.getElementById('toggleArticleSidebarBtn').addEventListener('click', () => {
            const sidebar = document.getElementById('articleSidebar');
            if (sidebar.classList.contains('w-0')) {
                sidebar.classList.remove('w-0', 'border-r-0', 'overflow-hidden');
                sidebar.classList.add('w-64');
            } else {
                sidebar.classList.remove('w-64');
                sidebar.classList.add('w-0', 'border-r-0', 'overflow-hidden');
            }
        });

        // Search articles
        document.getElementById('articleSearch').addEventListener('input', (e) => {
            loadArticleList(e.target.value);
        });

        // ==========================================
        // 初始化
        // ==========================================
        initDB().catch(err => console.error("Could not init IndexedDB", err));
        loadExistingCoreWords().then(() => updateSidebarView()).catch(err => console.error("Could not load core words", err));
        
        // 如果 URL 参数中指定了文章 ID，立即直接开始加载该文章进行阅读
        const initialArticleId = getArticleIdFromUrl();
        if (initialArticleId) {
            loadArticle(initialArticleId, false, false);
        }

        loadArticleList();
        updateSidebarView();

        // 绑定翻译列表的句子播放、复制与重点/易错打标签事件监听（事件委托）
        const transContainer = document.getElementById('translation-container');
        if (transContainer) {
            transContainer.addEventListener('click', async (e) => {
                // 1. 句子重点 / 易错 标签按钮点击
                const tagBtn = e.target.closest('.tag-sentence-btn');
                if (tagBtn) {
                    e.stopPropagation();
                    const pid = tagBtn.dataset.pid;
                    const sid = tagBtn.dataset.sid;
                    const tag = tagBtn.dataset.tag;
                    await handleTagButtonClick(window.activeArticleUuid, pid, sid, tag);
                    return;
                }
                // 2. 播放发音
                const playBtn = e.target.closest('.play-sentence-btn');
                if (playBtn) {
                    let text = playBtn.dataset.text;
                    if (text) {
                        text = text.replace(/\s+/g, '');
                        window.playAudioDirect(text);
                    }
                    return;
                }
                // 3. 复制原文
                const copyBtn = e.target.closest('.copy-sentence-btn');
                if (copyBtn) {
                    let text = copyBtn.dataset.text;
                    if (text) {
                        text = text.replace(/\s+/g, '');
                        copyTextToClipboard(text).then(() => {
                            const icon = copyBtn.querySelector('i');
                            const originalClass = icon.className;
                            icon.className = "fas fa-check text-green-600";
                            copyBtn.title = "已复制";
                            setTimeout(() => {
                                icon.className = originalClass;
                                copyBtn.title = "复制原文";
                            }, 1500);
                        }).catch(err => console.error("Copy failed", err));
                    }
                }
            });
        }

        const TOKEN_STORAGE_KEY = 'workerai_auth_token';

        function getWorkerAuthHeaders(extraHeaders = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...extraHeaders
            };
            const inputEl = document.getElementById('workerAuthToken');
            const token = (inputEl ? inputEl.value : (localStorage.getItem(TOKEN_STORAGE_KEY) || '')).trim();
            if (token && token.length > 0) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            return headers;
        }

        function clearWorkerAuthToken() {
            const inputEl = document.getElementById('workerAuthToken');
            if (inputEl) inputEl.value = '';
            localStorage.removeItem(TOKEN_STORAGE_KEY);
        }

        function initWorkerAuthTokenSync() {
            const inputEl = document.getElementById('workerAuthToken');
            if (!inputEl) return;
            inputEl.value = localStorage.getItem(TOKEN_STORAGE_KEY) || '';
            inputEl.addEventListener('input', () => {
                localStorage.setItem(TOKEN_STORAGE_KEY, inputEl.value.trim());
            });
        }
        document.addEventListener('DOMContentLoaded', initWorkerAuthTokenSync);
    </script>
</body>
