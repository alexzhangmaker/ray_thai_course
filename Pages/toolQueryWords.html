<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰语查词提取工具 - vCourse.ThaiNotes</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #8b5cf6; /* Violet 500 */
            --primary-hover: #7c3aed;
            --primary-light: #f5f3ff;
            --primary-glow: rgba(139, 92, 246, 0.15);
            --bg-main: #fafaf9; /* Warm stone-beige background */
            --bg-card: #ffffff;
            --text-main: #1c1917; /* Slate dark */
            --text-sub: #78716c; /* Stone grey */
            --border: #e7e5e4;
            --border-hover: #d6d3d1;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 26px;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-secondary {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-main);
            background-color: var(--bg-main);
        }

        /* App Main Workspace */
        .app-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 24px;
            padding: 24px 32px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            min-height: 0; /* Important for scrollable containers inside grid */
        }

        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
                height: auto;
                overflow-y: auto;
            }
        }

        .panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(120, 113, 108, 0.05);
            min-height: 0;
        }

        /* Left Panel: Query List */
        .list-panel {
            padding: 24px;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 16px 10px 40px;
            font-size: 13px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--primary);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 16px;
        }

        .sort-select {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            outline: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .sort-select:focus {
            border-color: var(--primary);
        }

        .selection-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .selection-info {
            color: var(--text-sub);
        }

        .selection-info span {
            font-weight: 700;
            color: var(--primary);
        }

        .selection-buttons {
            display: flex;
            gap: 12px;
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .link-btn:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        .word-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        /* Custom Scrollbar */
        .word-list::-webkit-scrollbar, .export-content::-webkit-scrollbar, .preview-textarea::-webkit-scrollbar {
            width: 5px;
        }
        .word-list::-webkit-scrollbar-track, .export-content::-webkit-scrollbar-track, .preview-textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        .word-list::-webkit-scrollbar-thumb, .export-content::-webkit-scrollbar-thumb, .preview-textarea::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .word-list::-webkit-scrollbar-thumb:hover, .export-content::-webkit-scrollbar-thumb:hover, .preview-textarea::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* Word Card */
        .word-card {
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: start;
            gap: 16px;
            transition: var(--transition);
            cursor: pointer;
            background-color: var(--bg-card);
            user-select: text; /* Allow copy inside card */
        }

        .word-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 6px 16px rgba(120, 113, 108, 0.04);
            transform: translateY(-1px);
        }

        .word-card.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .checkbox-wrapper {
            padding-top: 2px;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            background-color: var(--bg-card);
        }

        .word-card.selected .custom-checkbox {
            border-color: var(--primary);
            background-color: var(--primary);
        }

        .custom-checkbox i {
            color: white;
            font-size: 11px;
            display: none;
            font-weight: 850;
        }

        .word-card.selected .custom-checkbox i {
            display: block;
        }

        .word-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .word-thai-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .word-thai {
            font-family: 'Noto Serif Thai', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .word-time {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .word-explanations {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px dashed var(--border);
            padding-top: 10px;
        }

        .word-card.selected .word-explanations {
            border-top-color: rgba(139, 92, 246, 0.2);
        }

        .exp-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 13px;
            line-height: 1.4;
        }

        .exp-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 5px;
            background-color: var(--primary-light);
            color: var(--primary);
            border: 1px solid rgba(139, 92, 246, 0.15);
            flex-shrink: 0;
        }

        .exp-zh {
            color: #292524;
            font-weight: 600;
        }

        .exp-en {
            color: var(--text-sub);
            font-size: 12px;
        }

        .word-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: var(--bg-card);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            border-color: var(--danger);
            background-color: var(--danger-light);
        }

        /* Right Panel: Extraction Workspace */
        .export-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .export-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .export-subtitle {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
            font-weight: 500;
        }

        .export-content {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            min-height: 0;
        }

        .tabs {
            display: flex;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 4px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .tab-btn.active {
            background-color: var(--bg-card);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(120, 113, 108, 0.08);
        }

        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }

        .preview-textarea {
            flex: 1;
            width: 100%;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            font-family: 'Outfit', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #292524;
            resize: none;
            outline: none;
            transition: var(--transition);
        }

        .preview-textarea:focus {
            border-color: var(--primary);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .export-actions {
            padding: 24px;
            border-top: 1px solid var(--border);
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.2);
            font-family: inherit;
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1c1917;
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            color: var(--success);
            font-size: 16px;
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            color: var(--text-sub);
        }

        .empty-icon {
            font-size: 52px;
            color: var(--border-hover);
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 13px;
            max-w: 340px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <i class="ph-bold ph-cards"></i>
            </div>
            <h1>泰语查词历史管理与提取</h1>
        </div>
        <div class="header-actions">
            <a href="./appPortal.html" class="btn-secondary" title="返回系统导航入口">
                <i class="ph-bold ph-squares-four"></i>
                <span>系统导航</span>
            </a>
            <a href="/Pages/appWordset.html" class="btn-secondary">
                <i class="ph-bold ph-arrow-left"></i>
                <span>返回词汇自测</span>
            </a>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="app-container">
        
        <!-- Left Panel: Word list & filtering -->
        <div class="panel list-panel">
            <!-- Search and Sort controls -->
            <div class="filter-bar">
                <div class="search-wrapper">
                    <input type="text" id="search-input" oninput="filterList()" placeholder="输入泰语单词、拼音或中文/英文释义搜索..." class="search-input">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                </div>
                <select id="sort-select" onchange="sortRecords()" class="sort-select">
                    <option value="newest">最新查询</option>
                    <option value="oldest">最早查询</option>
                    <option value="alphabetical">字母排序 (A-Z)</option>
                </select>
            </div>

            <!-- Selection helper bar -->
            <div class="selection-bar">
                <div class="selection-info">
                    已选择 <span id="selected-count">0</span> / <span id="filtered-count">0</span> 个单词
                </div>
                <div class="selection-buttons" style="display: flex; gap: 12px; align-items: center;">
                    <button class="link-btn" onclick="selectAllFiltered()">全选当前</button>
                    <button class="link-btn" onclick="deselectAllFiltered()">取消全选</button>
                    <span style="color: var(--border); font-size: 12px;">|</span>
                    <button class="link-btn" style="color: var(--danger);" onclick="deleteSelectedRecords()">删除选择单词</button>
                </div>
            </div>

            <!-- Word Cards list container -->
            <div class="word-list" id="word-list-container">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Right Panel: Selection Extractor preview & actions -->
        <div class="panel export-panel">
            <div class="export-header">
                <div class="export-title">
                    <i class="ph-bold ph-file-arrow-up text-violet-500"></i>
                    <span>提取清单导出</span>
                </div>
                <p class="export-subtitle">提取并转换您筛选出的单词清单格式</p>
            </div>
            
            <div class="export-content">
                <!-- Format selecting tabs -->
                <div class="tabs">
                    <button id="tab-txt" class="tab-btn active" onclick="switchFormat('txt')">TXT 格式</button>
                    <button id="tab-json" class="tab-btn" onclick="switchFormat('json')">JSON 格式</button>
                    <button id="tab-csv" class="tab-btn" onclick="switchFormat('csv')">CSV 表格</button>
                </div>

                <!-- Preview text area -->
                <div class="preview-wrapper">
                    <textarea id="preview-area" class="preview-textarea" readonly placeholder="请在左侧列表中勾选需要提取的单词..."></textarea>
                </div>
            </div>

            <!-- Action buttons footer -->
            <div class="export-actions">
                <button onclick="copyToClipboard()" class="btn-primary">
                    <i class="ph-bold ph-copy"></i>
                    <span>复制清单到剪贴板</span>
                </button>
                <button onclick="copyWordsOnlyToClipboard()" class="btn-secondary" style="justify-content: center; padding: 12px; border-radius: 14px; color: var(--primary); border-color: rgba(139, 92, 246, 0.25); background-color: var(--primary-light);">
                    <i class="ph-bold ph-text-t"></i>
                    <span>复制清单（单词）</span>
                </button>
                <button onclick="downloadFile()" class="btn-secondary" style="justify-content: center; padding: 12px; border-radius: 14px;">
                    <i class="ph-bold ph-download-simple"></i>
                    <span>下载提取文件</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Toast Alert popup -->
    <div id="toast" class="toast">
        <i class="ph-fill ph-check-circle"></i>
        <span id="toast-message">复制成功!</span>
    </div>

    <!-- Scripts Controller -->
    <script>
        const DB_NAME = 'ThaiReadingCoachDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'wordQueries';

        let db = null;
        let wordRecords = [];
        let selectedIds = new Set();
        let currentFormat = 'txt'; // 'txt' | 'json' | 'csv'
        let filterText = '';

        // TTS Pronunciation Play
        window.playAudioDirect = (text) => {
            if (!text) return;
            const cleanText = text.replace(/“|”/g, '').trim();
            const url = `https://googleapi-w56agazoha-uc.a.run.app/?text=${encodeURIComponent(cleanText)}`;
            new Audio(url).play().catch(err => console.error("TTS Audio error:", err));
        };

        // IndexedDB Initialization
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('sentenceTags')) {
                        const store = db.createObjectStore('sentenceTags', { keyPath: 'id' });
                        store.createIndex('articleId', 'articleId', { unique: false });
                        store.createIndex('article_paragraph_sentence', ['articleId', 'paragraphId', 'sentenceId'], { unique: false });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // Auto-migrate legacy localStorage query history from appTranslate.html if present
        async function migrateLegacyTranslateQueries(db) {
            try {
                const legacyDataStr = localStorage.getItem('translate_query_history');
                if (!legacyDataStr) return;
                const legacyRecords = JSON.parse(legacyDataStr);
                if (!Array.isArray(legacyRecords) || legacyRecords.length === 0) {
                    localStorage.removeItem('translate_query_history');
                    return;
                }

                await new Promise((resolve, reject) => {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);

                    for (const item of legacyRecords) {
                        if (item && item.word) {
                            store.add({
                                word: item.word,
                                explanations: item.explanations || [],
                                timestamp: item.timestamp || Date.now()
                            });
                        }
                    }
                    transaction.oncomplete = () => {
                        localStorage.removeItem('translate_query_history');
                        console.log(`Migrated ${legacyRecords.length} legacy translate queries to IndexedDB.`);
                        resolve();
                    };
                    transaction.onerror = (e) => reject(e.target.error);
                });
            } catch (e) {
                console.error("Failed to migrate legacy translate queries:", e);
            }
        }

        // Load all word history from IndexedDB
        async function loadRecords() {
            try {
                db = await initDB();
                await migrateLegacyTranslateQueries(db);
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = (e) => {
                    wordRecords = e.target.result || [];
                    
                    // Sort by newest by default
                    sortRecords();

                    // Pre-select all words initially
                    selectedIds.clear();
                    wordRecords.forEach(record => selectedIds.add(record.id));

                    renderList();
                    updateExtractionPreview();
                };

                request.onerror = (e) => {
                    console.error("IndexedDB load error:", e.target.error);
                    showEmptyState("加载本地数据失败，请重试。");
                };
            } catch (err) {
                console.error("DB Connection error:", err);
                showEmptyState("未检测到通用查词历史数据库。请在词汇自测或阅读页面查词后再使用此提取工具。");
            }
        }

        // Show empty database card
        function showEmptyState(customMsg) {
            const container = document.getElementById('word-list-container');
            const desc = customMsg || "您还没有任何查词历史数据。您可以在单词自测、阅读教练或翻译练习中选中并查询生词，生词会记录在这里。";
            container.innerHTML = `
                <div class="empty-state">
                    <i class="ph ph-magnifying-glass-plus empty-icon"></i>
                    <h4 class="empty-title">查词历史为空</h4>
                    <p class="empty-desc">${desc}</p>
                </div>
            `;
            document.getElementById('preview-area').value = '';
            document.getElementById('selected-count').textContent = '0';
            document.getElementById('filtered-count').textContent = '0';
        }

        // Render cards lists
        function renderList() {
            const container = document.getElementById('word-list-container');
            const filtered = getFilteredRecords();

            document.getElementById('filtered-count').textContent = filtered.length;
            document.getElementById('selected-count').textContent = Array.from(selectedIds).filter(id => filtered.some(r => r.id === id)).length;

            if (filtered.length === 0) {
                if (wordRecords.length === 0) {
                    showEmptyState();
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="ph ph-magnifying-glass empty-icon"></i>
                            <h4 class="empty-title">未找到匹配的词汇</h4>
                            <p class="empty-desc">尝试更改搜索关键词以筛选其他单词。</p>
                        </div>
                    `;
                }
                return;
            }

            container.innerHTML = filtered.map(item => {
                const dateStr = new Date(item.timestamp).toLocaleDateString('zh-CN', {
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                const isSelected = selectedIds.has(item.id);
                
                let expHtml = '';
                if (item.explanations && item.explanations.length > 0) {
                    expHtml = item.explanations.map(exp => `
                        <div class="exp-item">
                            <span class="exp-tag">译</span>
                            <span class="exp-zh">${exp.meanCh}</span>
                            <span class="exp-en">(${exp.meanEn})</span>
                        </div>
                    `).join('');
                } else {
                    expHtml = `<div class="exp-item"><span class="exp-en" style="font-style: italic;">暂无详细解释</span></div>`;
                }

                return `
                    <div class="word-card ${isSelected ? 'selected' : ''}" data-id="${item.id}" onclick="handleCardClick(event, ${item.id})">
                        <div class="checkbox-wrapper">
                            <div class="custom-checkbox">
                                <i class="ph-bold ph-check"></i>
                            </div>
                        </div>
                        <div class="word-info">
                            <div class="word-thai-header">
                                <span class="word-thai">${item.word}</span>
                                <span class="word-time">${dateStr}</span>
                            </div>
                            <div class="word-explanations">
                                ${expHtml}
                            </div>
                        </div>
                        <div class="word-actions">
                            <button onclick="event.stopPropagation(); playAudioDirect('${item.word}')" class="action-btn" title="播放发音">
                                <i class="ph-bold ph-speaker-high"></i>
                            </button>
                            <button onclick="event.stopPropagation(); handleDelete('${item.word}', ${item.id})" class="action-btn delete" title="删除记录">
                                <i class="ph-bold ph-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Toggle card selected state
        function handleCardClick(event, id) {
            // Prevent selection trigger on action buttons
            if (event.target.closest('.word-actions')) return;
            
            if (selectedIds.has(id)) {
                selectedIds.delete(id);
            } else {
                selectedIds.add(id);
            }
            renderList();
            updateExtractionPreview();
        }

        // Get list of words matching current search
        function getFilteredRecords() {
            return wordRecords.filter(item => {
                if (!filterText) return true;
                const wordMatch = item.word.toLowerCase().includes(filterText);
                const meanMatch = item.explanations && item.explanations.some(exp => 
                    (exp.meanCh && exp.meanCh.toLowerCase().includes(filterText)) || 
                    (exp.meanEn && exp.meanEn.toLowerCase().includes(filterText))
                );
                return wordMatch || meanMatch;
            });
        }

        // Trigger filter list
        function filterList() {
            filterText = document.getElementById('search-input').value.toLowerCase().trim();
            renderList();
        }

        // Sort records list
        function sortRecords() {
            const val = document.getElementById('sort-select').value;
            if (val === 'newest') {
                wordRecords.sort((a, b) => b.timestamp - a.timestamp);
            } else if (val === 'oldest') {
                wordRecords.sort((a, b) => a.timestamp - b.timestamp);
            } else if (val === 'alphabetical') {
                wordRecords.sort((a, b) => a.word.localeCompare(b.word, 'th'));
            }
            renderList();
        }

        // Selection helper actions
        function selectAllFiltered() {
            const filtered = getFilteredRecords();
            filtered.forEach(item => selectedIds.add(item.id));
            renderList();
            updateExtractionPreview();
        }

        function deselectAllFiltered() {
            const filtered = getFilteredRecords();
            filtered.forEach(item => selectedIds.delete(item.id));
            renderList();
            updateExtractionPreview();
        }

        // Delete all currently selected word records
        async function deleteSelectedRecords() {
            const selected = getSelectedRecords();
            if (selected.length === 0) {
                showToast("请先在列表中勾选需要删除的单词", true);
                return;
            }

            if (!confirm(`确认要从本地数据库中删除已勾选的 ${selected.length} 个单词查询记录吗？此操作不可逆！`)) {
                return;
            }

            try {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);

                // Run deletions
                const deletePromises = selected.map(item => {
                    return new Promise((resolve, reject) => {
                        const request = store.delete(item.id);
                        request.onsuccess = () => resolve(item.id);
                        request.onerror = (e) => reject(e.target.error);
                    });
                });

                await Promise.all(deletePromises);

                // Update local arrays & states
                const deletedIds = new Set(selected.map(item => item.id));
                wordRecords = wordRecords.filter(item => !deletedIds.has(item.id));
                selected.forEach(item => selectedIds.delete(item.id));

                renderList();
                updateExtractionPreview();
                showToast(`已成功删除 ${deletedIds.size} 条记录`);
            } catch (err) {
                console.error("Batch delete records failed:", err);
                showToast("删除失败，请重试", true);
            }
        }

        // Delete word record
        async function handleDelete(word, id) {
            if (confirm(`确认要从本地数据库中删除 "${word}" 的查询记录吗？`)) {
                try {
                    const transaction = db.transaction([STORE_NAME], 'readwrite');
                    const store = transaction.objectStore(STORE_NAME);
                    const request = store.delete(id);

                    request.onsuccess = () => {
                        wordRecords = wordRecords.filter(item => item.id !== id);
                        selectedIds.delete(id);
                        renderList();
                        updateExtractionPreview();
                        showToast("已成功删除该条记录");
                    };
                    request.onerror = (e) => console.error("IndexedDB delete error:", e.target.error);
                } catch (err) {
                    console.error("Delete record failed:", err);
                }
            }
        }

        // Format selection tabs control
        function switchFormat(format) {
            currentFormat = format;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${format}`).classList.add('active');
            updateExtractionPreview();
        }

        // Get selected word objects
        function getSelectedRecords() {
            // Keep the sorting of the current list
            return wordRecords.filter(record => selectedIds.has(record.id));
        }

        // Live update extraction panel text
        function updateExtractionPreview() {
            const selected = getSelectedRecords();
            const textarea = document.getElementById('preview-area');

            if (selected.length === 0) {
                textarea.value = '';
                return;
            }

            let result = '';
            if (currentFormat === 'txt') {
                result = selected.map(r => {
                    const meanings = r.explanations && r.explanations.length > 0 
                        ? r.explanations.map(exp => `${exp.meanCh} / ${exp.meanEn}`).join('; ')
                        : '无释义';
                    return `${r.word}\t${meanings}`;
                }).join('\n');
            } else if (currentFormat === 'json') {
                const cleaned = selected.map(r => ({
                    word: r.word,
                    explanations: r.explanations || [],
                    timestamp: r.timestamp
                }));
                result = JSON.stringify(cleaned, null, 2);
            } else if (currentFormat === 'csv') {
                const header = '单词,中文释义,英文释义,查询时间\n';
                const rows = selected.map(r => {
                    const word = `"${r.word.replace(/"/g, '""')}"`;
                    const zh = r.explanations && r.explanations.length > 0 
                        ? `"${r.explanations.map(exp => exp.meanCh).join('; ').replace(/"/g, '""')}"`
                        : '""';
                    const en = r.explanations && r.explanations.length > 0 
                        ? `"${r.explanations.map(exp => exp.meanEn).join('; ').replace(/"/g, '""')}"`
                        : '""';
                    const date = `"${new Date(r.timestamp).toLocaleString()}"`;
                    return `${word},${zh},${en},${date}`;
                }).join('\n');
                result = header + rows;
            }

            textarea.value = result;
        }

        // Helper to copy text to clipboard with fallback for non-secure contexts
        function copyTextToClipboard(text, onSuccess, onError) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(err => {
                    console.warn("navigator.clipboard copy failed, trying fallback...", err);
                    if (fallbackCopyText(text)) {
                        onSuccess();
                    } else {
                        onError();
                    }
                });
            } else {
                if (fallbackCopyText(text)) {
                    onSuccess();
                } else {
                    onError();
                }
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            let successful = false;
            try {
                successful = document.execCommand('copy');
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }
            document.body.removeChild(textArea);
            return successful;
        }

        // Copy extraction text to clipboard
        function copyToClipboard() {
            const textarea = document.getElementById('preview-area');
            if (!textarea.value) {
                showToast("没有可复制的单词清单，请先选择单词", true);
                return;
            }

            copyTextToClipboard(
                textarea.value,
                () => showToast("清单已成功复制到剪贴板！"),
                () => showToast("复制失败，请手动选取文本复制", true)
            );
        }

        // Copy only Thai words to clipboard, removing spaces and separating with commas
        function copyWordsOnlyToClipboard() {
            const selected = getSelectedRecords();
            if (selected.length === 0) {
                showToast("没有可复制的单词清单，请先选择单词", true);
                return;
            }

            const cleanWords = selected.map(r => r.word.replace(/\s+/g, '')).join(',');

            copyTextToClipboard(
                cleanWords,
                () => showToast("仅泰语单词清单已成功复制到剪贴板！"),
                () => showToast("复制失败，请重试", true)
            );
        }

        // Download extraction list as file
        function downloadFile() {
            const textarea = document.getElementById('preview-area');
            if (!textarea.value) {
                showToast("没有可下载的单词清单，请先选择单词", true);
                return;
            }

            let filename = `extracted_words_${Date.now()}`;
            let mimeType = 'text/plain';

            if (currentFormat === 'txt') {
                filename += '.txt';
            } else if (currentFormat === 'json') {
                filename += '.json';
                mimeType = 'application/json';
            } else if (currentFormat === 'csv') {
                filename += '.csv';
                mimeType = 'text/csv';
            }

            const blob = new Blob([textarea.value], { type: `${mimeType};charset=utf-8;` });
            const link = document.createElement("a");
            
            if (navigator.msSaveBlob) { // IE 10+
                navigator.msSaveBlob(blob, filename);
            } else {
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", filename);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            showToast(`已成功下载文件 ${filename}`);
        }

        // Toast Pop-up alert
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            
            toastMsg.textContent = message;
            
            const icon = toast.querySelector('i');
            if (isError) {
                icon.className = "ph-fill ph-warning-circle text-rose-500";
            } else {
                icon.className = "ph-fill ph-check-circle text-emerald-500";
            }

            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Run application on start
        window.addEventListener('DOMContentLoaded', () => {
            loadRecords();
        });
    </script>
</body>
</html>
